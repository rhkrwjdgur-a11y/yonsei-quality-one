<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Q-Safety | 연세유업 품질안전 통합 관제 시스템</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
      background-color: #EEF2F6;
      color: #0F172A;
      -webkit-font-smoothing: antialiased;
    }

    ::-webkit-scrollbar { width: 7px; height: 7px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 999px; }
    ::-webkit-scrollbar-thumb:hover { background: #94A3B8; }

    .sidebar-scroll::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.25); }
    .sidebar-scroll::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.42); }

    .qo-card {
      background: #FFFFFF;
      border: 1px solid #DCE3EC;
      border-radius: 12px;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.05);
    }
    .qo-card-hover {
      transition: all 0.16s ease;
    }
    .qo-card-hover:hover {
      border-color: #60A5FA;
      box-shadow: 0 6px 18px rgba(0, 51, 120, 0.10);
      transform: translateY(-1px);
    }

    .badge-pill {
      display: inline-flex;
      align-items: center;
      padding: 3px 9px;
      border-radius: 6px;
      font-size: 12.2px;
      font-weight: 800;
      white-space: nowrap;
      line-height: 1.25;
    }
    .badge-ok { background-color: #ECFDF5; color: #047857; border: 1px solid #6EE7B7; }
    .badge-warn { background-color: #FFFBEB; color: #B45309; border: 1px solid #FCD34D; }
    .badge-err { background-color: #FEF2F2; color: #DC2626; border: 1px solid #FCA5A5; }
    .badge-info { background-color: #EFF6FF; color: #003378; border: 1px solid #93C5FD; }
    .badge-purple { background-color: #F5F3FF; color: #6D28D9; border: 1px solid #C4B5FD; }
    .badge-neutral { background-color: #F1F5F9; color: #334155; border: 1px solid #CBD5E1; }

    .mon-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13.4px;
      background: #FFFFFF;
      border: 1px solid #DCE3EC;
      border-radius: 8px;
      overflow: hidden;
    }
    .mon-table th {
      background: #F8FAFC;
      color: #0F172A;
      font-weight: 800;
      padding: 9.5px 11px;
      border-bottom: 1px solid #DCE3EC;
      text-align: center;
      white-space: nowrap;
    }
    .mon-table td {
      padding: 8.5px 11px;
      border-bottom: 1px solid #EEF2F6;
      color: #0F172A;
      vertical-align: middle;
      line-height: 1.5;
      word-break: keep-all;
    }
    .mon-table tr:hover td { background-color: #F8FAFC; }
    .cell-green { background-color: #ECFDF5 !important; color: #047857 !important; font-weight: 700; }
    .cell-yellow { background-color: #FFFBEB !important; color: #B45309 !important; font-weight: 700; }
    .cell-red { background-color: #FEF2F2 !important; color: #DC2626 !important; font-weight: 700; }
    .cell-gray { background-color: #F8FAFC !important; color: #64748B !important; font-weight: 600; }

    .nav-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 12px;
      border-radius: 7px;
      font-size: 13.5px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.85);
      transition: all 0.14s ease;
      text-align: left;
    }
    .nav-btn:hover {
      background-color: rgba(255, 255, 255, 0.12);
      color: #FFFFFF;
    }
    .nav-btn.active {
      background-color: #164E96;
      color: #FFFFFF;
      font-weight: 800;
      box-shadow: inset 3.5px 0 0 #93C5FD;
    }

    .subtab-btn {
      padding: 9px 15px;
      font-size: 13.8px;
      font-weight: 700;
      color: #475569;
      border-bottom: 2.5px solid transparent;
      transition: all 0.14s ease;
    }
    .subtab-btn:hover { color: #0F172A; }
    .subtab-btn.active {
      color: #003378;
      border-bottom-color: #003378;
      font-weight: 800;
    }

    .btn-yonsei {
      background-color: #003378;
      color: #FFFFFF;
      transition: all 0.15s ease;
    }
    .btn-yonsei:hover:not(:disabled) { background-color: #00265C; }
    .btn-yonsei:disabled { opacity: 0.6; cursor: not-allowed; }
  </style>
</head>
<body class="h-screen w-screen overflow-hidden flex select-none sm:select-auto">

  <!-- ===================================================================== -->
  <!-- 좌측 고정 사이드바 (#003378 WEB MIS 네이비)                           -->
  <!-- ===================================================================== -->
  <aside class="w-[244px] shrink-0 bg-[#003378] text-white flex flex-col justify-between h-full shadow-lg z-20">
    <div class="p-3.5 overflow-y-auto sidebar-scroll">
      <div onclick="navigate('main')" class="flex items-center gap-2.5 px-2 pb-3.5 mb-2.5 border-b border-white/15 cursor-pointer group">
        <div class="w-9 h-9 rounded-full bg-white flex items-center justify-center p-0.5 shrink-0 shadow-sm overflow-hidden">
          <img
            src="/img-symbol1.png"
            alt="연세유업 심볼"
            class="w-full h-full object-contain"
            onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
          />
          <svg style="display:none;" viewBox="0 0 40 40" class="w-7 h-7 text-[#003378]" fill="none">
            <circle cx="20" cy="20" r="18" stroke="currentColor" stroke-width="2.5"/>
            <circle cx="20" cy="14" r="4" stroke="currentColor" stroke-width="2.3"/>
            <line x1="12" y1="21" x2="28" y2="21" stroke="currentColor" stroke-width="2.3"/>
            <path d="M13 29 L20 23 L27 29" stroke="currentColor" stroke-width="2.4" fill="none"/>
          </svg>
        </div>
        <div class="min-w-0">
          <div class="text-[17.5px] font-extrabold text-white tracking-wide leading-tight group-hover:text-blue-200 transition">Q-Safety</div>
          <div class="text-[11.5px] font-medium text-blue-200/90 truncate">연세유업 품질안전 통합관제</div>
        </div>
      </div>

      <!-- 1. 품질안전부문 (통합) -->
      <div class="text-[11px] font-bold text-blue-200/70 uppercase tracking-wider px-2.5 pt-0.5 pb-1">품질안전부문 (통합)</div>
      <div class="space-y-0.5 mb-2.5">
        <button class="nav-btn active" data-nav="main" onclick="navigate('main')">
          <span class="flex items-center gap-2.5"><i data-lucide="layout-grid" class="w-4 h-4"></i><span>통합 대시보드</span></span>
          <i data-lucide="chevron-right" class="w-3.5 h-3.5 opacity-60"></i>
        </button>
        <button class="nav-btn" data-nav="dept_kpi8" onclick="navigate('dept_kpi8')">
          <span class="flex items-center gap-2.5"><i data-lucide="bar-chart-3" class="w-4 h-4"></i><span>2026 부문 8대 KPI</span></span>
          <i data-lucide="chevron-right" class="w-3.5 h-3.5 opacity-60"></i>
        </button>
      </div>

      <!-- 2. 식품안전팀 (QA) -->
      <div class="text-[11px] font-bold text-blue-200/70 uppercase tracking-wider px-2.5 pt-2 pb-1 border-t border-white/10">식품안전팀 (QA)</div>
      <div class="space-y-0.5 mb-2.5">
        <button class="nav-btn" data-nav="label_status" onclick="navigate('label_status')">
          <span class="flex items-center gap-2.5"><i data-lucide="file-check-2" class="w-4 h-4"></i><span>표시사항 진행 현황</span></span>
          <i data-lucide="chevron-right" class="w-3.5 h-3.5 opacity-60"></i>
        </button>
        <button class="nav-btn" data-nav="label_issue" onclick="navigate('label_issue')">
          <span class="flex items-center gap-2.5"><i data-lucide="database" class="w-4 h-4"></i><span>원자재 표시사항 DB</span></span>
          <i data-lucide="chevron-right" class="w-3.5 h-3.5 opacity-60"></i>
        </button>
        <button class="nav-btn" data-nav="kpi_5" onclick="navigate('kpi_5')">
          <span class="flex items-center gap-2.5"><i data-lucide="gauge" class="w-4 h-4"></i><span>심사점수 · 일정 관리</span></span>
          <i data-lucide="chevron-right" class="w-3.5 h-3.5 opacity-60"></i>
        </button>
        <button class="nav-btn" data-nav="supplier" onclick="navigate('supplier')">
          <span class="flex items-center gap-2.5"><i data-lucide="building-2" class="w-4 h-4"></i><span>협력업체 관리</span></span>
          <i data-lucide="chevron-right" class="w-3.5 h-3.5 opacity-60"></i>
        </button>
        <button class="nav-btn" data-nav="fs_haccp_risk" onclick="navigate('fs_haccp_risk')">
          <span class="flex items-center gap-2.5"><i data-lucide="shield-check" class="w-4 h-4"></i><span>HACCP · 법적 RISK</span></span>
          <i data-lucide="chevron-right" class="w-3.5 h-3.5 opacity-60"></i>
        </button>
      </div>

      <!-- 3. 품질관리팀 (QC) -->
      <div class="text-[11px] font-bold text-blue-200/70 uppercase tracking-wider px-2.5 pt-2 pb-1 border-t border-white/10">품질관리팀 (QC)</div>
      <div class="space-y-0.5">
        <button class="nav-btn" data-nav="process" onclick="navigate('process')">
          <span class="flex items-center gap-2.5"><i data-lucide="activity" class="w-4 h-4"></i><span>공정 및 배양 실시간 관제</span></span>
          <i data-lucide="chevron-right" class="w-3.5 h-3.5 opacity-60"></i>
        </button>
        <button class="nav-btn" data-nav="micro_report" onclick="navigate('micro_report')">
          <span class="flex items-center gap-2.5"><i data-lucide="microscope" class="w-4 h-4"></i><span>미생물 검사일보</span></span>
          <i data-lucide="chevron-right" class="w-3.5 h-3.5 opacity-60"></i>
        </button>
        <button class="nav-btn" data-nav="claim_nc_hist" onclick="navigate('claim_nc_hist', {cnhMainTab:'hist'})">
          <span class="flex items-center gap-2.5"><i data-lucide="search-check" class="w-4 h-4"></i><span>클레임 · LOT 역추적</span></span>
          <i data-lucide="chevron-right" class="w-3.5 h-3.5 opacity-60"></i>
        </button>
        <button class="nav-btn" data-nav="claim" onclick="navigate('claim')">
          <span class="flex items-center gap-2.5"><i data-lucide="trending-down" class="w-4 h-4"></i><span>클레임 발생률 분석</span></span>
          <i data-lucide="chevron-right" class="w-3.5 h-3.5 opacity-60"></i>
        </button>
        <button class="nav-btn" data-nav="qc_defect_sub" onclick="navigate('qc_defect_sub')">
          <span class="flex items-center gap-2.5"><i data-lucide="package-check" class="w-4 h-4"></i><span>핵심불량 · 부자재 관리</span></span>
          <i data-lucide="chevron-right" class="w-3.5 h-3.5 opacity-60"></i>
        </button>
      </div>
    </div>

    <!-- 하단 실시간 동기화 & 아산공장 푸터 -->
    <div class="p-3.5 border-t border-white/15 bg-[#002860]">
      <button onclick="loadBundle(true)" id="btn-sidebar-sync" class="w-full py-2 px-3 rounded-md bg-[#164E96] hover:bg-[#1E5BB0] border border-white/15 text-white text-[12.5px] font-bold flex items-center justify-center gap-1.5 transition">
        <i data-lucide="refresh-cw" class="w-3.5 h-3.5" id="icon-sync"></i>
        <span id="txt-sidebar-sync">시트 실시간 갱신</span>
      </button>
      <div class="mt-2 text-[11px] text-blue-200/80 leading-relaxed px-0.5">
        <div>동기화 : <span id="lbl-loaded-at" class="text-white font-semibold">연결 확인 중...</span></div>
        <div class="flex items-center justify-between mt-0.5">
          <span>연세유업 아산공장 품질안전부문</span>
          <span class="text-[10px] px-1.5 py-0.2 rounded bg-white/15 text-blue-100 font-bold">자동갱신 ON</span>
        </div>
      </div>
    </div>
  </aside>

  <!-- ===================================================================== -->
  <!-- 우측 메인 컨텐츠 영역                                                   -->
  <!-- ===================================================================== -->
  <div class="flex-1 flex flex-col h-full min-w-0">

    <!-- 상단 글로벌 헤더 (화면 글자 크기 배율 조절기 포함) -->
    <header class="h-[52px] shrink-0 bg-white border-b border-[#DCE3EC] px-5 flex items-center justify-between gap-3">
      <div class="flex items-center gap-2 text-[13px] font-bold text-slate-500">
        <span class="text-[#003378] font-extrabold">Q-Safety</span>
        <span>/</span>
        <span id="header-breadcrumb" class="text-slate-900 font-extrabold">통합 대시보드 (모닝 브리핑)</span>
      </div>

      <div class="flex items-center gap-2.5 shrink-0">
        <!-- 대형 모니터용 원클릭 글자 크기 조절 버튼 -->
        <div class="hidden md:flex items-center bg-slate-100 border border-slate-200 rounded-lg p-0.5 text-[11.5px] font-extrabold">
          <span class="px-2 text-slate-500">화면배율</span>
          <button onclick="setUiZoom(1.0)" id="zoom-btn-100" class="px-2 py-1 rounded text-slate-700 hover:bg-white transition">표준</button>
          <button onclick="setUiZoom(1.12)" id="zoom-btn-112" class="px-2 py-1 rounded text-slate-700 hover:bg-white transition">크게</button>
          <button onclick="setUiZoom(1.22)" id="zoom-btn-122" class="px-2 py-1 rounded text-slate-700 hover:bg-white transition">특대</button>
        </div>

        <div class="relative w-60 sm:w-72">
          <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
          <input
            id="global-search-input"
            type="text"
            placeholder="LOT(소비기한 05.13) · 제품명 검색..."
            class="w-full pl-9 pr-12 py-1.5 text-[13px] font-medium bg-[#F8FAFC] border border-slate-300 rounded-full focus:outline-none focus:bg-white focus:border-[#003378] transition"
            onkeydown="if(event.key==='Enter') triggerGlobalSearch();"
          />
          <span class="absolute right-3 top-1/2 -translate-y-1/2 text-[10.5px] font-bold text-slate-400">Enter</span>
        </div>

        <button onclick="openAiBriefingModal()" class="px-3.5 py-1.5 rounded-full bg-[#EFF6FF] hover:bg-blue-100 text-[#003378] border border-blue-200 text-[12.5px] font-extrabold flex items-center gap-1.5 transition">
          <i data-lucide="sparkles" class="w-3.5 h-3.5"></i>
          <span class="hidden sm:inline">AI 요약 브리핑</span>
        </button>

        <div class="hidden xl:inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-emerald-50 border border-emerald-200 text-emerald-800 text-[12px] font-extrabold">
          <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
          <span id="top-live-pill">실시간 연동 중</span>
        </div>

        <button onclick="loadBundle(true)" title="시트 데이터 즉시 갱신" class="p-1.5 rounded-full border border-slate-200 text-slate-700 hover:text-[#003378] hover:bg-slate-50 transition">
          <i data-lucide="rotate-cw" class="w-4 h-4" id="icon-top-sync"></i>
        </button>
      </div>
    </header>

    <!-- 동적 메인 뷰포트 -->
    <main id="app-viewport" class="flex-1 min-h-0 overflow-hidden px-5 py-2.5 flex flex-col">
      <div class="h-full flex flex-col items-center justify-center text-center">
        <div class="w-10 h-10 border-4 border-[#003378] border-t-transparent rounded-full animate-spin mb-3"></div>
        <div class="text-base font-extrabold text-slate-800">Q-Safety 실시간 품질안전 데이터를 불러오는 중입니다...</div>
        <div class="text-sm text-slate-500 mt-1">연세유업 품질·공정·미생물·법규·심사 구글 시트와 동기화하고 있습니다.</div>
      </div>
    </main>
  </div>

  <!-- 공통 모달창 -->
  <div id="modal-backdrop" class="fixed inset-0 bg-slate-900/45 backdrop-blur-[1px] z-50 hidden items-center justify-center p-4">
    <div class="bg-white rounded-xl border border-slate-200 shadow-2xl w-full max-w-2xl overflow-hidden">
      <div class="px-5 py-3.5 bg-[#003378] text-white flex items-center justify-between">
        <h3 id="modal-title" class="text-[15.5px] font-extrabold">상세 정보</h3>
        <button onclick="closeModal()" class="text-white/80 hover:text-white">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>
      <div id="modal-body" class="p-5 text-[14px] text-slate-800 max-h-[80vh] overflow-y-auto"></div>
    </div>
  </div>

  <!-- 우측 하단 즉시 상태 토스트 알림 -->
  <div id="toast-box" class="fixed bottom-5 right-5 z-50 hidden px-4 py-2.5 rounded-lg bg-[#003378] text-white text-[13px] font-extrabold shadow-xl"></div>

  <script>
    // =========================================================================
    // 전역 상태 관리 · 화면 배율(Zoom) 컨트롤 · 공통 유틸리티
    // =========================================================================
    const LOCAL_BACKUP_KEY = 'qsafety_last_good_bundle_v7';
    const UI_ZOOM_KEY = 'qsafety_ui_zoom_v1';

    const STATE = {
      view: 'main',
      bundle: null,
      isSyncing: false,
      uiZoom: 1.0,
      charts: {},
      claimTab: 'all',
      claimDivYear: '2026년',
      claimDivType: 'dairy',
      claimTableYear: '전체',
      procTab: 'rt',
      rtHistIdx: 0,
      dairySubTab: 'milk',
      dairyOnlyRun: true,
      dairyHistDate: '',
      dairyHistLine: 'ALL',
      soySelTab: '',
      soyHistMode: 'insp',
      soyHistDate: '',
      microLiveTab: '일보작성',
      microHistMode: 'judge',
      microHistDate: '',
      microHistCat: 'ALL',
      microKw: '',
      cnhMainTab: 'hist',
      cnhCatFilter: '전체',
      cnhStatusFilter: '전체',
      cnhKw: '',
      // LOT 역추적: 단일 통합 검색어(productText)로 통합하여 지워지지 않는 충돌 현상 원천 해결
      lotQuery: { productText: '', exp: '', result: null, loading: false },
      labelTab: 'yoy',
      labelSearchKw: '',
      rawSearchKw: '',
      supTab: 'kpi',
      supAffFilter: '전체',
      supGubun: '전체',
      supGrade: '전체',
      supKw: '',
      auditTab: 'score',
      auditHistKw: '',
      auditOnlyOpen: false,
      auditSelIdx: 0,
      fsTab: 'law_dday',
      lawTabFilter: '전체',
      lawOnlyQs: false,
      lawKw: '',
      qcTab: 'kpi_9'
    };

    function applyUiZoom(zVal) {
      const z = Number(zVal) || 1.0;
      STATE.uiZoom = z;
      document.body.style.zoom = String(z);
      [
        { id: 'zoom-btn-100', val: 1.0 },
        { id: 'zoom-btn-112', val: 1.12 },
        { id: 'zoom-btn-122', val: 1.22 }
      ].forEach(b => {
        const el = document.getElementById(b.id);
        if (!el) return;
        if (Math.abs(z - b.val) < 0.02) {
          el.className = 'px-2 py-1 rounded bg-[#003378] text-white shadow-2xs transition';
        } else {
          el.className = 'px-2 py-1 rounded text-slate-700 hover:bg-white transition';
        }
      });
    }

    function setUiZoom(zVal) {
      try { localStorage.setItem(UI_ZOOM_KEY, String(zVal)); } catch (e) {}
      applyUiZoom(zVal);
    }

    function initUiZoom() {
      let saved = null;
      try { saved = localStorage.getItem(UI_ZOOM_KEY); } catch (e) {}
      if (saved) {
        applyUiZoom(parseFloat(saved));
      } else {
        // 대형 고해상도 모니터(가로 1700px 이상)에서는 첫 진입 시 자동으로 '크게(1.12)' 적용
        const defaultZoom = window.innerWidth >= 1700 ? 1.12 : 1.0;
        applyUiZoom(defaultZoom);
      }
    }

    const VIEW_TITLES = {
      main: '통합 대시보드 (모닝 브리핑)',
      dept_kpi8: '2026 품질안전부문 8대 KPI',
      cost: '1. 원가 절감 상세 분석',

    function esc(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');

    function saveLocalBundleBackup(bundle) {

        }
      } catch (e) {}

    function loadLocalBundleBackup() {

        const parsed = JSON.parse(raw);
        return (parsed && parsed.ok) ? parsed : null;
      } catch (e) {

    function applyBundleDefaults(data) {
      if (!data || !data.ok) return;
      if (data.loaded_at) {
        document.getElementById('lbl-loaded-at').textContent = data.loaded_at;
        document.getElementById('top-live-pill').textContent = `실시간 연동 · ${data.loaded_time_short || ''}`;
      }
      if (data.process) {
        if (!STATE.soySelTab && data.process.soy_default_tab) {
          STATE.soySelTab = data.process.soy_default_tab;
        }
        if (!STATE.dairyHistDate && data.process.dairy_hist_p && data.process.dairy_hist_p.length > 0) {
          const dts = [...new Set(data.process.dairy_hist_p.map(r => r['생산일자']).filter(Boolean))].sort().reverse();
          if (dts.length) STATE.dairyHistDate = dts[0];
        }
        if (!STATE.soyHistDate && data.process.soy_hist && data.process.soy_hist.length > 0) {
          const col = data.process.soy_hist[0]['확정검사일_탭기준'] !== undefined ? '확정검사일_탭기준' : '검사일_표기';
          const dts = [...new Set(data.process.soy_hist.map(r => r[col]).filter(Boolean))].sort().reverse();
          if (dts.length) STATE.soyHistDate = dts[0];
        }
        if (data.process.micro) {
          const mc = data.process.micro;
          if (mc.default_live_tab && (!mc.live_tabs || !mc.live_tabs[STATE.microLiveTab])) {
            STATE.microLiveTab = mc.default_live_tab;
          }
          if (!STATE.microHistDate && mc.hist_rows && mc.hist_rows.length > 0) {
            const col = STATE.microHistMode === 'insp' ? '검사일자_생산일' : '판정일자';
            const dts = [...new Set(mc.hist_rows.map(r => r[col]).filter(Boolean))].sort().reverse();
            if (dts.length) STATE.microHistDate = dts[0];
          }
        }
      }
      if (data.claim && data.claim.years && data.claim.years.length > 0) {
        if (!data.claim.years.includes(STATE.claimDivYear)) {
          STATE.claimDivYear = data.claim.years[0];
        }
      }
    }

    async function loadBundle(force = false, silent = false) {
      if (STATE.isSyncing) return;
      STATE.isSyncing = true;

      const syncIcon = document.getElementById('icon-sync');
      const topIcon = document.getElementById('icon-top-sync');
      const syncTxt = document.getElementById('txt-sidebar-sync');
      if (syncIcon) syncIcon.classList.add('animate-spin');
      if (topIcon) topIcon.classList.add('animate-spin');
      if (syncTxt && force) syncTxt.textContent = '시트 동기화 중...';

      try {
        const res = await fetch(`/api/bundle?force=${force ? 1 : 0}`);
        const data = await res.json();

        if (data && data.ok) {
          STATE.bundle = data;
          saveLocalBundleBackup(data);
          applyBundleDefaults(data);
          renderCurrentView();
          if (force && !silent) showToast('전체 구글 시트 최신 데이터 갱신 완료');

          if (data.errors && data.errors.length > 0 && !silent) {
            setTimeout(() => loadBundle(true, true), 6500);
          }
        } else if (!STATE.bundle) {
          STATE.bundle = data;
          renderCurrentView();
        }
      } catch (err) {
        if (!silent) showToast('일시적 통신 지연 — 직전 정상 데이터를 유지합니다.', true);
        console.error(err);
      } finally {
        STATE.isSyncing = false;
        if (syncIcon) syncIcon.classList.remove('animate-spin');
        if (topIcon) topIcon.classList.remove('animate-spin');
        if (syncTxt) syncTxt.textContent = '시트 실시간 갱신';
      }
    }

    function clearLotProductField() {
      STATE.lotQuery.productText = '';

      if (el) {
        el.value = '';
        el.focus();
      }
    }

    function clearLotExpField() {
      STATE.lotQuery.exp = '';
      const el = document.getElementById('lot-in-exp');
      if (el) {
        el.value = '';
        el.focus();
      }
    }

    function resetAllLotFields() {
      STATE.lotQuery = { productText: '', exp: '', result: null, loading: false };
      renderCurrentView();
    }

    async function executeLotTraceSearch() {
      const prodEl = document.getElementById('lot-in-prod');
      const expEl = document.getElementById('lot-in-exp');

      if (prodEl) STATE.lotQuery.productText = prodEl.value.trim();
      if (expEl) STATE.lotQuery.exp = expEl.value.trim();

      if (!STATE.lotQuery.productText && !STATE.lotQuery.exp) {
        showToast('포장 제품명(또는 부분 키워드)이나 소비기한 중 하나 이상을 입력해 주세요.', true);
        return;
      }

      STATE.lotQuery.loading = true;
      renderCurrentView();

      try {
        const params = new URLSearchParams({
          product: STATE.lotQuery.productText,
          exp: STATE.lotQuery.exp,
          kw: ''
        });
        const res = await fetch(`/api/lot-trace?${params.toString()}`);
        STATE.lotQuery.result = await res.json();
      } catch (e) {
        showToast('로트 역추적 조회 중 오류가 발생했습니다.', true);
      } finally {
        STATE.lotQuery.loading = false;
        renderCurrentView();
      }
    }

    function renderLotTraceSectionHtml(b) {
      const p = b.process;
      const prods = p.master_products || [];
      const q = STATE.lotQuery;
      const res = q.result;

      let resHtml = '';
      if (q.loading) {
        resHtml = '<div class="qo-card p-8 text-center text-[14px] font-extrabold text-[#003378]">포장일보 · 살균/멸균 CCP · 배양 · 미생물(주1~주12 각주 포함) DB를 교차 추적 중입니다...</div>';
      } else if (res && res.ok) {
        const total = (res.counts.rt || 0) + (res.counts.soy || 0) + (res.counts.dairy || 0) + (res.counts.micro || 0);
