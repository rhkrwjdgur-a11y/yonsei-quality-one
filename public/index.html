<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YONSEI QUALITY ONE | 품질안전 통합 관제 플랫폼</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
      background-color: #F7F8FA;
      color: #111827;
      -webkit-font-smoothing: antialiased;
    }

    /* 커스텀 슬림 스크롤바 */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #D1D5DB; border-radius: 999px; }
    ::-webkit-scrollbar-thumb:hover { background: #9CA3AF; }

    /* 엔터프라이즈 카드 & 배지 */
    .qo-card {
      background: #FFFFFF;
      border: 1px solid #EAECF0;
      border-radius: 12px;
      box-shadow: 0 1px 3px rgba(16, 24, 40, 0.04);
    }
    .qo-card-hover {
      transition: all 0.16s ease;
    }
    .qo-card-hover:hover {
      border-color: #BFDBFE;
      box-shadow: 0 6px 16px rgba(37, 99, 235, 0.08);
      transform: translateY(-1px);
    }

    .badge-pill {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 11.5px;
      font-weight: 600;
      white-space: nowrap;
    }
    .badge-ok { background-color: #ECFDF5; color: #047857; }
    .badge-warn { background-color: #FFFBEB; color: #B45309; }
    .badge-err { background-color: #FEF2F2; color: #DC2626; }
    .badge-info { background-color: #EFF6FF; color: #1D4ED8; }
    .badge-neutral { background-color: #F3F4F6; color: #4B5563; }

    /* 공정 관제 테이블 셀 상태 색상 (백엔드 클래스 1:1 호환) */
    .mon-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12.5px;
      background: #FFFFFF;
      border: 1px solid #EAECF0;
      border-radius: 8px;
      overflow: hidden;
    }
    .mon-table th {
      background: #F9FAFB;
      color: #374151;
      font-weight: 700;
      padding: 9px 10px;
      border-bottom: 1px solid #EAECF0;
      text-align: center;
      white-space: nowrap;
    }
    .mon-table td {
      padding: 8px 10px;
      border-bottom: 1px solid #F2F4F7;
      color: #1F2937;
      vertical-align: middle;
      line-height: 1.45;
    }
    .mon-table tr:hover td { background-color: #F9FAFB; }
    .cell-green { background-color: #ECFDF5 !important; color: #047857 !important; font-weight: 600; }
    .cell-yellow { background-color: #FFFBEB !important; color: #B45309 !important; font-weight: 600; }
    .cell-red { background-color: #FEF2F2 !important; color: #DC2626 !important; font-weight: 600; }
    .cell-gray { background-color: #F9FAFB !important; color: #9CA3AF !important; }

    /* 사이드바 메뉴 버튼 */
    .nav-btn {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 8px 11px;
      border-radius: 8px;
      font-size: 13.2px;
      font-weight: 500;
      color: #4B5563;
      transition: all 0.14s ease;
      text-align: left;
    }
    .nav-btn:hover { background-color: #F3F4F6; color: #111827; }
    .nav-btn.active {
      background-color: #EFF6FF;
      color: #1D4ED8;
      font-weight: 700;
      border: 1px solid #DBEAFE;
    }

    /* 서브 탭 버튼 */
    .subtab-btn {
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      color: #6B7280;
      border-bottom: 2px solid transparent;
      transition: all 0.14s ease;
    }
    .subtab-btn:hover { color: #111827; }
    .subtab-btn.active {
      color: #1D4ED8;
      border-bottom-color: #2563EB;
      font-weight: 700;
    }
  </style>
</head>
<body class="h-screen w-screen overflow-hidden flex select-none sm:select-auto">

  <!-- ===================================================================== -->
  <!-- 좌측 고정 사이드바 (3단 분류: 품질안전부문 / 식품안전팀 / 품질관리팀) -->
  <!-- ===================================================================== -->
  <aside class="w-[240px] shrink-0 bg-white border-r border-[#EAECF0] flex flex-col justify-between h-full">
    <div class="p-3.5 overflow-y-auto">
      <!-- 브랜드 헤더 -->
      <div onclick="navigate('main')" class="flex items-center gap-2.5 px-2 pb-3.5 mb-3 border-b border-[#F2F4F7] cursor-pointer">
        <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-blue-700 to-blue-600 text-white font-black text-sm flex items-center justify-center shadow-sm">
          Y
        </div>
        <div>
          <div class="text-[14.5px] font-extrabold text-gray-900 tracking-tight leading-tight">YONSEI QUALITY</div>
          <div class="text-[10.8px] font-medium text-gray-500">Integrated Quality Platform</div>
        </div>
      </div>

      <!-- 1. 품질안전부문 (통합) -->
      <div class="text-[11px] font-bold text-gray-400 px-2.5 pt-1 pb-1.5">품질안전부문 (통합)</div>
      <div class="space-y-0.5 mb-3">
        <button class="nav-btn active" data-nav="main" onclick="navigate('main')">
          <i data-lucide="layout-grid" class="w-4 h-4"></i><span>통합 대시보드</span>
        </button>
        <button class="nav-btn" data-nav="dept_kpi8" onclick="navigate('dept_kpi8')">
          <i data-lucide="bar-chart-3" class="w-4 h-4"></i><span>2026 부문 8대 KPI</span>
        </button>
      </div>

      <!-- 2. 식품안전팀 (QA) -->
      <div class="text-[11px] font-bold text-gray-400 px-2.5 pt-2 pb-1.5">식품안전팀 (QA)</div>
      <div class="space-y-0.5 mb-3">
        <button class="nav-btn" data-nav="label_status" onclick="navigate('label_status')">
          <i data-lucide="file-check-2" class="w-4 h-4"></i><span>표시사항 진행 현황</span>
        </button>
        <button class="nav-btn" data-nav="label_issue" onclick="navigate('label_issue')">
          <i data-lucide="database" class="w-4 h-4"></i><span>원자재 표시사항 DB</span>
        </button>
        <button class="nav-btn" data-nav="kpi_5" onclick="navigate('kpi_5')">
          <i data-lucide="gauge" class="w-4 h-4"></i><span>심사점수 · 일정 관리</span>
        </button>
        <button class="nav-btn" data-nav="supplier" onclick="navigate('supplier')">
          <i data-lucide="building-2" class="w-4 h-4"></i><span>협력업체 서류심사</span>
        </button>
        <button class="nav-btn" data-nav="fs_haccp_risk" onclick="navigate('fs_haccp_risk')">
          <i data-lucide="shield-check" class="w-4 h-4"></i><span>HACCP · 법적 RISK</span>
        </button>
      </div>

      <!-- 3. 품질관리팀 (QC) -->
      <div class="text-[11px] font-bold text-gray-400 px-2.5 pt-2 pb-1.5">품질관리팀 (QC)</div>
      <div class="space-y-0.5">
        <button class="nav-btn" data-nav="process" onclick="navigate('process')">
          <i data-lucide="activity" class="w-4 h-4"></i><span>공정 및 배양 실시간 관제</span>
        </button>
        <button class="nav-btn" data-nav="lot_trace" onclick="navigate('lot_trace')">
          <i data-lucide="search-check" class="w-4 h-4"></i><span>생산이력 · LOT 역추적</span>
        </button>
        <button class="nav-btn" data-nav="claim" onclick="navigate('claim')">
          <i data-lucide="trending-down" class="w-4 h-4"></i><span>클레임 발생률 분석</span>
        </button>
        <button class="nav-btn" data-nav="qc_defect_sub" onclick="navigate('qc_defect_sub')">
          <i data-lucide="package-check" class="w-4 h-4"></i><span>핵심불량 · 부자재 관리</span>
        </button>
      </div>
    </div>

    <!-- 하단 동기화 정보 -->
    <div class="p-3.5 border-t border-[#F2F4F7] bg-[#FCFCFD]">
      <button onclick="loadBundle(true)" id="btn-sidebar-sync" class="w-full py-1.5 px-3 rounded-lg border border-gray-200 bg-white hover:bg-blue-50 hover:border-blue-200 hover:text-blue-700 text-xs font-semibold text-gray-700 flex items-center justify-center gap-1.5 transition">
        <i data-lucide="refresh-cw" class="w-3.5 h-3.5" id="icon-sync"></i>
        <span>시트 실시간 동기화</span>
      </button>
      <div class="mt-2 text-[10.8px] text-gray-400 leading-relaxed px-0.5">
        <div>기준 : <span id="lbl-loaded-at">데이터 연결 중...</span></div>
        <div>연세유업 아산공장 품질안전부문</div>
      </div>
    </div>
  </aside>

  <!-- ===================================================================== -->
  <!-- 우측 메인 컨텐츠 영역 (상단 글로벌 헤더 + 동적 뷰포트 컨테이너)         -->
  <!-- ===================================================================== -->
  <div class="flex-1 flex flex-col h-full min-w-0">

    <!-- 상단 글로벌 바 (고정 54px) -->
    <header class="h-[54px] shrink-0 bg-white border-b border-[#EAECF0] px-6 flex items-center justify-between gap-4">
      <!-- 글로벌 LOT / 제품명 즉시 검색창 -->
      <div class="relative w-full max-w-md">
        <i data-lucide="search" class="w-4 h-4 text-gray-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
        <input
          id="global-search-input"
          type="text"
          placeholder="LOT(소비기한 예: 27.05.13) 또는 제품명 입력 후 Enter..."
          class="w-full pl-9 pr-16 py-1.5 text-[13px] bg-[#F9FAFB] border border-gray-200 rounded-lg focus:outline-none focus:bg-white focus:border-blue-500 transition"
          onkeydown="if(event.key==='Enter') triggerGlobalSearch();"
        />
        <span class="absolute right-2.5 top-1/2 -translate-y-1/2 text-[10.5px] font-semibold text-gray-400 border border-gray-200 rounded px-1.5 py-0.5 bg-white">Enter</span>
      </div>

      <!-- 우측 상태 배지 & AI 브리핑 버튼 -->
      <div class="flex items-center gap-2.5 shrink-0">
        <button onclick="openAiBriefingModal()" class="px-3 py-1.5 rounded-lg bg-blue-50 hover:bg-blue-100 text-blue-700 border border-blue-200 text-xs font-bold flex items-center gap-1.5 transition">
          <i data-lucide="sparkles" class="w-3.5 h-3.5"></i>
          <span>AI 모닝 브리핑</span>
        </button>
        <div class="hidden md:inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-emerald-50 border border-emerald-200 text-emerald-700 text-[11.8px] font-semibold">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
          <span id="top-live-pill">실시간 운영 중</span>
        </div>
        <button onclick="loadBundle(true)" title="새로고침" class="p-1.5 rounded-lg border border-gray-200 text-gray-500 hover:text-blue-600 hover:bg-gray-50 transition">
          <i data-lucide="rotate-cw" class="w-4 h-4"></i>
        </button>
      </div>
    </header>

    <!-- 동적 메인 뷰포트 (main/dept_kpi8은 overflow-hidden 100% 고정, 세부 화면은 overflow-y-auto 자유 스크롤) -->
    <main id="app-viewport" class="flex-1 min-h-0 overflow-hidden px-6 py-4 flex flex-col">
      <!-- 초기 로딩 스켈레톤 -->
      <div class="h-full flex flex-col items-center justify-center text-center">
        <div class="w-10 h-10 border-4 border-blue-600 border-t-transparent rounded-full animate-spin mb-3"></div>
        <div class="text-sm font-bold text-gray-800">구글 시트 실시간 데이터를 불러오는 중입니다...</div>
        <div class="text-xs text-gray-500 mt-1">최초 연결 시 9개 시트 병렬 동기화에 약 3~6초가 소요됩니다.</div>
      </div>
    </main>
  </div>

  <!-- ===================================================================== -->
  <!-- 공통 모달창 (특이사항 편집 / 클레임 이슈 등록 / AI 브리핑)              -->
  <!-- ===================================================================== -->
  <div id="modal-backdrop" class="fixed inset-0 bg-gray-900/40 backdrop-blur-[1px] z-50 hidden items-center justify-center p-4">
    <div class="bg-white rounded-xl border border-gray-200 shadow-xl w-full max-w-lg overflow-hidden">
      <div class="px-5 py-3.5 border-b border-gray-100 flex items-center justify-between">
        <h3 id="modal-title" class="text-[15px] font-bold text-gray-900">편집</h3>
        <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>
      <div id="modal-body" class="p-5 text-sm text-gray-700 max-h-[72vh] overflow-y-auto"></div>
    </div>
  </div>

  <!-- 토스트 알림 -->
  <div id="toast-box" class="fixed bottom-5 right-5 z-50 hidden px-4 py-2.5 rounded-lg bg-gray-900 text-white text-xs font-semibold shadow-lg"></div>

  <script>
    // =========================================================================
    // 전역 상태 관리 & 공통 유틸리티
    // =========================================================================
    const STATE = {
      view: 'main',
      bundle: null,
      charts: {},
      // 세부 화면별 서브탭 & 필터 상태 유지
      claimTab: 'all',
      claimDivYear: '2026년',
      claimDivType: 'dairy',
      claimTableYear: '전체',
      procTab: 'rt',
      rtHistIdx: 0,
      dairySubTab: 'milk',
      dairyOnlyRun: true,
      dairyHistDate: '',
      dairyHistLine: 'ALL',
      soySelTab: '',
      soyHistMode: 'insp',
      soyHistDate: '',
      lotQuery: { product: 'ALL', exp: '', kw: '', result: null, loading: false },
      labelTab: 'rev',
      labelSearchKw: '',
      rawSearchKw: '',
      supTab: 'list',
      supGubun: '전체',
      supGrade: '전체',
      supKw: '',
      auditSelIdx: 0,
      fsTab: 'kpi_8',
      qcTab: 'kpi_9'
    };

    const AUDIT_STAGES = [
      { name: '심사준비중', short: '준비중', pct: 20 },
      { name: '심사중', short: '심사중', pct: 50 },
      { name: '서류심사중', short: '서류심사', pct: 75 },
      { name: '현장심사중', short: '현장심사', pct: 85 },
      { name: '심사종료', short: '심사종료', pct: 100 }
    ];

    const CLAIM_STEPS = [
      { step: 1, label: '접수·확인필요' },
      { step: 2, label: '원인분석중' },
      { step: 3, label: '조치예정' },
      { step: 4, label: '조치완료' }
    ];

    const ACTIVE_NAV_ALIAS = {
      cost: 'dept_kpi8',
      kpi_11: 'supplier',
      kpi_8: 'fs_haccp_risk',
      kpi_12: 'fs_haccp_risk',
      kpi_9: 'qc_defect_sub',
      kpi_10: 'qc_defect_sub'
    };

    function esc(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function fmtNum(n, digits = 0) {
      const v = Number(n || 0);
      return v.toLocaleString('ko-KR', { minimumFractionDigits: digits, maximumFractionDigits: digits });
    }

    function signalDotHtml(sig) {
      const map = {
        green: 'bg-emerald-500 ring-4 ring-emerald-500/15',
        yellow: 'bg-amber-500 ring-4 ring-amber-500/15',
        red: 'bg-red-500 ring-4 ring-red-500/15',
        gray: 'bg-gray-400 ring-4 ring-gray-400/15'
      };
      return `<span class="inline-block w-2.5 h-2.5 rounded-full ${map[sig] || map.green}"></span>`;
    }

    function showToast(msg, isErr = false) {
      const el = document.getElementById('toast-box');
      el.textContent = msg;
      el.className = `fixed bottom-5 right-5 z-50 px-4 py-2.5 rounded-lg text-white text-xs font-semibold shadow-lg ${isErr ? 'bg-red-600' : 'bg-gray-900'}`;
      el.classList.remove('hidden');
      setTimeout(() => el.classList.add('hidden'), 2800);
    }

    function destroyCharts() {
      Object.values(STATE.charts).forEach(ch => {
        try { ch.destroy(); } catch (e) {}
      });
      STATE.charts = {};
    }

    function openModal(title, bodyHtml) {
      document.getElementById('modal-title').textContent = title;
      document.getElementById('modal-body').innerHTML = bodyHtml;
      const bd = document.getElementById('modal-backdrop');
      bd.classList.remove('hidden');
      bd.classList.add('flex');
      lucide.createIcons();
    }

    function closeModal() {
      const bd = document.getElementById('modal-backdrop');
      bd.classList.add('hidden');
      bd.classList.remove('flex');
    }

    function getKoreanTodayLabel() {
      const days = ['일', '월', '화', '수', '목', '금', '토'];
      const d = new Date();
      return `${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일 (${days[d.getDay()]})`;
    }

    // =========================================================================
    // 네비게이션 라우터 (main & dept_kpi8 = No-Scroll 100vh / 세부 = 자유 스크롤)
    // =========================================================================
    function navigate(viewName, extra = {}) {
      if (viewName === 'kpi_8' || viewName === 'kpi_12') {
        STATE.fsTab = viewName;
        viewName = 'fs_haccp_risk';
      } else if (viewName === 'kpi_9' || viewName === 'kpi_10') {
        STATE.qcTab = viewName;
        viewName = 'qc_defect_sub';
      } else if (viewName === 'kpi_11') {
        STATE.supTab = 'kpi';
        viewName = 'supplier';
      }

      if (extra.procTab) STATE.procTab = extra.procTab;
      STATE.view = viewName;

      // 사이드바 활성 표시 동기화
      const navTarget = ACTIVE_NAV_ALIAS[viewName] || viewName;
      document.querySelectorAll('.nav-btn').forEach(btn => {
        if (btn.dataset.nav === navTarget) btn.classList.add('active');
        else btn.classList.remove('active');
      });

      // 뷰포트 스크롤 모드 차등 적용
      const vp = document.getElementById('app-viewport');
      if (viewName === 'main' || viewName === 'dept_kpi8') {
        vp.classList.remove('overflow-y-auto');
        vp.classList.add('overflow-hidden');
      } else {
        vp.classList.remove('overflow-hidden');
        vp.classList.add('overflow-y-auto');
        vp.scrollTop = 0;
      }

      renderCurrentView();
    }

    function jumpToLotTrace(prodKw = '', expStr = '') {
      STATE.lotQuery.product = 'ALL';
      STATE.lotQuery.kw = prodKw || '';
      STATE.lotQuery.exp = expStr || '';
      navigate('lot_trace');
      if (STATE.lotQuery.kw || STATE.lotQuery.exp) {
        executeLotTraceSearch();
      }
    }

    function triggerGlobalSearch() {
      const inp = document.getElementById('global-search-input');
      const q = (inp.value || '').trim();
      if (!q) return;
      inp.value = '';
      if (/\d{1,4}[\.\-\/]\d{1,2}/.test(q)) {
        jumpToLotTrace('', q);
      } else {
        jumpToLotTrace(q, '');
      }
    }

    // =========================================================================
    // 백엔드 API 데이터 로드 (/api/bundle)
    // =========================================================================
    async function loadBundle(force = false) {
      const syncIcon = document.getElementById('icon-sync');
      if (syncIcon) syncIcon.classList.add('animate-spin');

      try {
        const res = await fetch(`/api/bundle?force=${force ? 1 : 0}`);
        const data = await res.json();
        STATE.bundle = data;

        if (data.loaded_at) {
          document.getElementById('lbl-loaded-at').textContent = data.loaded_at;
          document.getElementById('top-live-pill').textContent = `실시간 운영 중 · ${data.loaded_time_short || ''}`;
        }

        // 초기 기본 선택값 세팅
        if (data.process) {
          if (!STATE.soySelTab && data.process.soy_default_tab) {
            STATE.soySelTab = data.process.soy_default_tab;
          }
          if (!STATE.dairyHistDate && data.process.dairy_hist_p && data.process.dairy_hist_p.length > 0) {

        const pairMap = new Map();

          if (!pairMap.has(k)) pairMap.set(k, { dt: r['생산일자'], tab: r['원본탭명'] });

        const datePairs = Array.from(pairMap.values()).sort((a, z) => (z.dt || '').localeCompare(a.dt || ''));

    // =========================================================================
    async function executeLotTraceSearch() {
      const prodEl = document.getElementById('lot-sel-prod');
      const expEl = document.getElementById('lot-in-exp');
      const kwEl = document.getElementById('lot-in-kw');

      if (prodEl) STATE.lotQuery.product = prodEl.value;
      if (expEl) STATE.lotQuery.exp = expEl.value.trim();
      if (kwEl) STATE.lotQuery.kw = kwEl.value.trim();

      if (STATE.lotQuery.product === 'ALL' && !STATE.lotQuery.exp && !STATE.lotQuery.kw) {
        showToast('제품명을 선택하거나 소비기한/키워드를 입력해 주세요.', true);
        return;
      }

      STATE.lotQuery.loading = true;
      renderCurrentView();

      try {
        const params = new URLSearchParams({
          product: STATE.lotQuery.product === 'ALL' ? '' : STATE.lotQuery.product,
          exp: STATE.lotQuery.exp,
          kw: STATE.lotQuery.kw
        });
        const res = await fetch(`/api/lot-trace?${params.toString()}`);
        STATE.lotQuery.result = await res.json();
      } catch (e) {
        showToast('로트 역추적 조회 중 오류가 발생했습니다.', true);
      } finally {
        STATE.lotQuery.loading = false;
        renderCurrentView();
      }
    }

    function renderLotTraceView(vp, b) {
      const p = b.process;
      const prods = p.master_products || [];

      const res = q.result;

      let resHtml = '';
      if (q.loading) {
        resHtml = '<div class="qo-card p-8 text-center text-xs font-bold text-blue-700">상온 · 배양 · 유제품 누적 이력 DB를 교차 추적 중입니다...</div>';
      } else if (res && res.ok) {
        const total = (res.counts.rt || 0) + (res.counts.soy || 0) + (res.counts.dairy || 0);
        if (total === 0) {
          resHtml = '<div class="qo-card p-6 text-center text-xs text-amber-800 bg-amber-50 border-amber-200">일치하는 생산·배양 이력이 발견되지 않았습니다. 소비기한을 월.일(예: 05.13) 형태로 줄이거나 키워드로 검색해 보세요.</div>';
        } else {
          resHtml = `
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-4">
              <div class="qo-card p-3.5"><div class="text-xs text-gray-500">상온 공정일보 매칭</div><div class="text-xl font-extrabold text-blue-700 mt-1">${res.counts.rt} 건</div></div>
              <div class="qo-card p-3.5"><div class="text-xs text-gray-500">두유 배양검사 매칭 (실가동시간)</div><div class="text-xl font-extrabold text-emerald-700 mt-1">${res.counts.soy} 건</div></div>
              <div class="qo-card p-3.5"><div class="text-xs text-gray-500">유제품 포장일보 매칭</div><div class="text-xl font-extrabold text-indigo-700 mt-1">${res.counts.dairy} 건</div></div>
            </div>

            ${(res.matched_rt || []).length > 0 ? `
              <div class="qo-card p-4 mb-4">
                <div class="text-sm font-bold text-gray-900 mb-2.5">1. 상온 공정관리 일보 — 생산호기 · 멸균 CCP · 당일 특이사항</div>
                ${renderDynamicRecordsTable(res.matched_rt, ['최종백업일시', '표준소비기한_검색용'])}
                ${(res.matched_rt_ccp || []).length > 0 ? `
                  <details class="mt-3">
                    <summary class="cursor-pointer text-xs font-bold text-blue-600">해당 생산일 멸균기(CCP-1B/2P) · 포장기(CCP-3B) 세부 기록 전체 보기 (${res.matched_rt_ccp.length}건)</summary>
                    <div class="mt-2">${renderDynamicRecordsTable(res.matched_rt_ccp, ['최종백업일시'])}</div>
                  </details>
                ` : ''}
              </div>
            ` : ''}

            ${(res.matched_soy || []).length > 0 ? `
              <div class="qo-card p-4 mb-4">
                <div class="text-sm font-bold text-gray-900 mb-2.5">2. 두유 배양검사 일보 — 실 생산 시작~종료 시간(실가동시간) · 오염수량 · 판정</div>
                ${renderDynamicRecordsTable(res.matched_soy, ['최종백업일시', '표준소비기한_검색용'])}
              </div>
            ` : ''}

            ${(res.matched_dairy || []).length > 0 ? `
              <div class="qo-card p-4 mb-6">
                <div class="text-sm font-bold text-gray-900 mb-2.5">3. 유제품 포장 공정관리 일보 — 확인시간 · Tank · 살균기 CCP</div>

              </div>
            ` : ''}
          `;
        }
      } else {
        resHtml = '<div class="qo-card p-6 text-center text-xs text-gray-500">위에서 제품명을 선택하거나 소비기한을 입력한 뒤 <b>[이력 역추적 실행]</b>을 눌러주세요.</div>';
      }

      vp.innerHTML = `
        ${subPageHeaderHtml('생산이력 · 클레임 LOT 원스톱 역추적', `상온공정일보 '제품명 식품안전나라' A열(${fmtNum(p.fsk_products_cnt)}종) 및 전 공정 누적 이력 DB 자동 교차 검증`)}
        <div class="qo-card p-4 mb-4 bg-gradient-to-r from-slate-50 to-blue-50/50 border-blue-200">
          <div class="grid grid-cols-1 lg:grid-cols-12 gap-3 items-end">
            <div class="lg:col-span-5">
              <label class="block text-xs font-bold text-gray-700 mb-1">1. 제품명 선택 ('제품명 식품안전나라' A열 표준 연동)</label>
              <select id="lot-sel-prod" class="w-full px-3 py-2 text-xs font-semibold border border-gray-300 rounded-lg bg-white">
                <option value="ALL">전체 (제품 미선택 · 소비기한/키워드로 검색)</option>
                ${prods.map(pr => `<option value="${esc(pr)}" ${q.product === pr ? 'selected' : ''}>${esc(pr)}</option>`).join('')}
              </select>
            </div>
            <div class="lg:col-span-3">
              <label class="block text-xs font-bold text-gray-700 mb-1">2. 소비기한 입력</label>
              <input id="lot-in-exp" type="text" value="${esc(q.exp)}" placeholder="예: 2027-05-13, 27.05.13, 05.13"
                onkeydown="if(event.key==='Enter') executeLotTraceSearch();"
                class="w-full px-3 py-2 text-xs border border-gray-300 rounded-lg bg-white" />
            </div>
            <div class="lg:col-span-2">
              <label class="block text-xs font-bold text-gray-700 mb-1">3. 부분 품목 키워드</label>
              <input id="lot-in-kw" type="text" value="${esc(q.kw)}" placeholder="예: 검은콩, 고칼슘"
                onkeydown="if(event.key==='Enter') executeLotTraceSearch();"
                class="w-full px-3 py-2 text-xs border border-gray-300 rounded-lg bg-white" />
            </div>
            <div class="lg:col-span-2">
              <button onclick="executeLotTraceSearch()" class="w-full py-2 px-4 rounded-lg bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold shadow-xs transition">
                이력 역추적 실행
              </button>
            </div>
          </div>
        </div>
        ${resHtml}
      `;
    }

    // =========================================================================
    // [세부 5~9] 표시사항 / 원자재DB / 심사관리 / 협력업체 / 수동 KPI 편집기

      const tab = STATE.labelTab;
      let body = '';

      if (tab === 'rev') {
        body = `

          </div>
        </div>

        <div class="qo-card p-4 mb-4">
          <div class="text-sm font-bold text-gray-900 mb-2">전체 심사 일정 목록</div>
          ${renderDynamicRecordsTable(scheds, ['고유ID'])}
        </div>

        ${manualKpiEditorHtml('kpi_5', b)}
      `;
    }

    function renderFsHaccpRiskView(vp, b) {
      vp.innerHTML = `
        ${subPageHeaderHtml('식품안전 및 HACCP 강화 · 법적 RISK 관리', '식품안전팀 핵심 과제 이행 및 행정처분 Zero화 관리')}
        <div class="flex border-b border-gray-200 mb-4 gap-2">
          <button onclick="STATE.fsTab='kpi_8'; renderCurrentView();" class="subtab-btn ${STATE.fsTab === 'kpi_8' ? 'active' : ''}">3. 식품안전 및 HACCP 강화</button>
          <button onclick="STATE.fsTab='kpi_12'; renderCurrentView();" class="subtab-btn ${STATE.fsTab === 'kpi_12' ? 'active' : ''}">8. 식품안전 법적 RISK 최소화</button>
        </div>
        ${manualKpiEditorHtml(STATE.fsTab, b)}
      `;
    }

    function renderQcDefectSubView(vp, b) {
      vp.innerHTML = `
        ${subPageHeaderHtml('핵심불량 저감화 · 부자재 관리 고도화', '품질관리팀 중대 클레임 예방 및 포장 부자재 폐기 Zero 관리')}
        <div class="flex border-b border-gray-200 mb-4 gap-2">
          <button onclick="STATE.qcTab='kpi_9'; renderCurrentView();" class="subtab-btn ${STATE.qcTab === 'kpi_9' ? 'active' : ''}">4. 핵심불량(클레임) 발생 저감화</button>
          <button onclick="STATE.qcTab='kpi_10'; renderCurrentView();" class="subtab-btn ${STATE.qcTab === 'kpi_10' ? 'active' : ''}">5. 부자재 관리 고도화 (폐기 Zero)</button>
        </div>
        ${manualKpiEditorHtml(STATE.qcTab, b)}
      `;
    }

    // =========================================================================
    // 양방향 저장 액션 & 모달 핸들러 (심사 / 수동 KPI / 특이사항 / AI 브리핑)
    // =========================================================================
    async function quickChangeAuditStatus(newStatus) {
      if (!STATE.bundle) return;
      try {
        const res = await fetch('/api/audit-schedule', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'quick_status', status: newStatus })
        });
        const rj = await res.json();
        if (rj.ok) {
          STATE.bundle.audit = rj.audit;
          renderCurrentView();
          showToast(`심사 진행 단계가 '${newStatus}'(으)로 시트에 저장되었습니다.`);
        }
      } catch (e) {
        showToast('심사 상태 변경 중 오류가 발생했습니다.', true);
      }
    }

    async function submitAuditSchedule(action, uid = '') {
      const payload = { action, uid };
      if (action === 'add') {
        payload.audit_date = document.getElementById('aud-add-dt').value;
        payload.status = document.getElementById('aud-add-st').value;
        payload.audit_name = document.getElementById('aud-add-nm').value.trim();
        payload.score = document.getElementById('aud-add-sc').value.trim();
        payload.memo = document.getElementById('aud-add-mm').value.trim();
        if (!payload.audit_name) { showToast('심사명을 입력해 주세요.', true); return; }
      } else if (action === 'update') {
        payload.audit_date = document.getElementById('aud-up-dt').value;
        payload.status = document.getElementById('aud-up-st').value;
        payload.audit_name = document.getElementById('aud-up-nm').value.trim();
        payload.score = document.getElementById('aud-up-sc').value.trim();
        payload.memo = document.getElementById('aud-up-mm').value.trim();
      }

      try {
        const res = await fetch('/api/audit-schedule', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const rj = await res.json();
        if (rj.ok) {
          await loadBundle(true);
          showToast(rj.message || '저장 완료');
        }
      } catch (e) {
        showToast('시트 저장 중 오류가 발생했습니다.', true);
      }
    }

    async function saveManualKpi(kpiKey) {
      const notesRaw = document.getElementById(`mk-notes-${kpiKey}`).value || '';
      const payload = {
        kpi_key: kpiKey,
        target_text: document.getElementById(`mk-t-txt-${kpiKey}`).value,
        actual_text: document.getElementById(`mk-a-txt-${kpiKey}`).value,
        sub_badge: document.getElementById(`mk-sub-${kpiKey}`).value,
        signal: document.getElementById(`mk-sig-${kpiKey}`).value,
        target_num: Number(document.getElementById(`mk-t-num-${kpiKey}`).value || 0),
        actual_num: Number(document.getElementById(`mk-a-num-${kpiKey}`).value || 0),
        notes_title: document.getElementById(`mk-nt-${kpiKey}`).value,
        notes: notesRaw.split('\n').map(s => s.trim()).filter(Boolean)
      };

      try {
        const res = await fetch('/api/manual-kpi', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const rj = await res.json();
        if (rj.ok) {
          STATE.bundle.manual_kpis = rj.manual_kpis;
          renderCurrentView();
          showToast('구글 시트에 KPI 설정이 저장되었습니다.');
        }
      } catch (e) {
        showToast('KPI 저장 실패', true);
      }
    }

    function openLabelMemoModal() {
      const curMemo = (STATE.bundle && STATE.bundle.special_boards && STATE.bundle.special_boards.label_memo) || '';
      openModal('표시사항 특이사항 메모 편집 (시트 영구 저장)', `
        <p class="text-xs text-gray-500 mb-2">원재료 변경, 신규 알레르기 혼입 점검, 법규 개정 사항 등을 기록하면 모닝 브리핑 화면에 즉시 공유됩니다.</p>
        <textarea id="modal-lbl-memo" rows="6" class="w-full p-3 text-xs border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500">${esc(curMemo)}</textarea>
        <div class="flex justify-end gap-2 mt-4">
          <button onclick="closeModal()" class="px-3.5 py-1.5 rounded-lg border border-gray-200 text-xs font-semibold text-gray-600">취소</button>
          <button onclick="saveLabelMemoFromModal()" class="px-4 py-1.5 rounded-lg bg-blue-600 text-white text-xs font-bold">시트 저장</button>
        </div>
      `);
    }

    async function saveLabelMemoFromModal() {
      const val = document.getElementById('modal-lbl-memo').value.trim();
      const res = await fetch('/api/special-boards', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ label_memo: val })
      });
      const rj = await res.json();
      if (rj.ok) {
        STATE.bundle.special_boards = rj.special_boards;
        closeModal();
        renderCurrentView();
        showToast('표시사항 특이사항 메모가 저장되었습니다.');
      }
    }

    function openClaimIssueModal() {
      const list = (STATE.bundle && STATE.bundle.special_boards && STATE.bundle.special_boards.claim_issues) || [];
      openModal('클레임 · 부적합 사례 등록 및 관리', `
        <div class="space-y-2.5 pb-4 border-b border-gray-100">
          <div class="text-xs font-bold text-gray-800">신규 클레임 · 부적합 사례 추가</div>
          <input id="ci-desc" placeholder="사례 내용 (예: 고칼슘 두유 상부접착 확인 요망)" class="w-full px-3 py-1.5 text-xs border border-gray-300 rounded-lg" />
          <div class="grid grid-cols-3 gap-2">
            <select id="ci-step" class="px-2.5 py-1.5 text-xs border border-gray-300 rounded-lg bg-white">
              ${CLAIM_STEPS.map(s => `<option value="${s.step}">${s.step}단계: ${s.label}</option>`).join('')}
            </select>
            <input id="ci-prod" placeholder="제품 키워드 (예: 고칼슘)" class="px-2.5 py-1.5 text-xs border border-gray-300 rounded-lg" />
            <input id="ci-exp" placeholder="소비기한 (예: 05.13)" class="px-2.5 py-1.5 text-xs border border-gray-300 rounded-lg" />
          </div>
          <button onclick="addClaimIssueFromModal()" class="w-full py-2 rounded-lg bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold">+ 사례 추가 및 시트 저장</button>
        </div>
        <div class="mt-3">
          <div class="text-xs font-bold text-gray-700 mb-2">현재 등록된 목록 (${list.length}건)</div>
          <div class="space-y-1.5">
            ${list.map((it, idx) => `
              <div class="flex items-center justify-between gap-2 p-2 rounded bg-gray-50 border border-gray-200 text-xs">
                <span class="truncate font-semibold">${esc(it['특이사항'])}</span>
                <button onclick="deleteClaimIssueItem(${idx})" class="px-2 py-0.5 rounded bg-red-50 text-red-600 font-bold shrink-0">삭제</button>
              </div>
            `).join('')}
          </div>
        </div>
      `);
    }

    async function addClaimIssueFromModal() {
      const desc = document.getElementById('ci-desc').value.trim();
      if (!desc) { showToast('사례 내용을 입력해 주세요.', true); return; }
      const stepNum = Number(document.getElementById('ci-step').value || 1);
      const stObj = CLAIM_STEPS.find(x => x.step === stepNum) || CLAIM_STEPS[0];
      const cur = [...((STATE.bundle.special_boards && STATE.bundle.special_boards.claim_issues) || [])];
      cur.unshift({
        '구분': '클레임/부적합',
        '특이사항': desc,
        '상태': stObj.label,
        '진행단계': stepNum,
        '제품키워드': document.getElementById('ci-prod').value.trim(),
        '소비기한': document.getElementById('ci-exp').value.trim()
      });
      const res = await fetch('/api/special-boards', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ claim_issues: cur.slice(0, 10) })
      });
      const rj = await res.json();
      if (rj.ok) {
        STATE.bundle.special_boards = rj.special_boards;
        closeModal();
        renderCurrentView();
        showToast('클레임·부적합 사례가 시트에 저장되었습니다.');
      }
    }

    async function updateClaimIssueStep(idx, newStep) {
      const cur = [...((STATE.bundle.special_boards && STATE.bundle.special_boards.claim_issues) || [])];
      if (!cur[idx]) return;
      const stObj = CLAIM_STEPS.find(x => x.step === newStep) || CLAIM_STEPS[0];
      cur[idx]['진행단계'] = newStep;
      cur[idx]['상태'] = stObj.label;
      const res = await fetch('/api/special-boards', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ claim_issues: cur })
      });
      const rj = await res.json();
      if (rj.ok) {
        STATE.bundle.special_boards = rj.special_boards;
        renderCurrentView();
        showToast(`조치 단계가 '${stObj.label}'(${newStep}/4)로 변경되었습니다.`);
      }
    }

    async function deleteClaimIssueItem(idx) {
      const cur = [...((STATE.bundle.special_boards && STATE.bundle.special_boards.claim_issues) || [])];
      cur.splice(idx, 1);
      const res = await fetch('/api/special-boards', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ claim_issues: cur })
      });
      const rj = await res.json();
      if (rj.ok) {
        STATE.bundle.special_boards = rj.special_boards;
        openClaimIssueModal();
        renderCurrentView();
      }
    }

    async function openAiBriefingModal() {
      openModal('AI 모닝 팩트 브리핑', '<div class="py-6 text-center text-xs font-semibold text-blue-700">실시간 9개 시트 지표를 요약하고 있습니다...</div>');
      try {
        const res = await fetch('/api/ai-briefing', { method: 'POST' });
        const rj = await res.json();
        document.getElementById('modal-body').innerHTML = `
          <div class="p-4 rounded-lg bg-blue-50/70 border border-blue-200 text-[13px] text-gray-800 leading-relaxed whitespace-pre-line">${esc(rj.briefing || '')}</div>
          <div class="mt-3 flex items-center justify-between text-[11px] text-gray-400">
            <span>분석 엔진 : ${rj.source === 'gemini_api' ? 'Gemini 2.5 Flash (실시간 팩트 기반)' : '내장 팩트 요약 엔진'}</span>
            <button onclick="closeModal()" class="px-3.5 py-1.5 rounded-lg bg-gray-900 text-white text-xs font-bold">확인</button>
          </div>
        `;
      } catch (e) {
        document.getElementById('modal-body').innerHTML = '<div class="text-xs text-red-600">브리핑 생성에 실패했습니다.</div>';
      }
    }

    function openErrorsModal() {
      const errs = (STATE.bundle && STATE.bundle.errors) || [];
      openModal('시트 연동 상태 점검 내역', `
        <ul class="space-y-1.5 text-xs text-red-700 list-disc pl-4">
          ${errs.map(e => `<li>${esc(e)}</li>`).join('')}
        </ul>
      `);
    }

    // =========================================================================
    // 통합 뷰 디스패처
    // =========================================================================
    function renderCurrentView() {
      destroyCharts();
      const vp = document.getElementById('app-viewport');
      const b = STATE.bundle;

      if (!b) return;
      if (!b.ok) {
        vp.innerHTML = `
          <div class="qo-card p-6 max-w-xl mx-auto my-auto text-center">
            <div class="text-base font-extrabold text-red-600 mb-2">구글 시트 인증 환경변수를 확인해 주세요</div>
            <div class="text-xs text-gray-600 leading-relaxed mb-4">${(b.errors || []).map(esc).join('<br>')}</div>
            <button onclick="loadBundle(true)" class="px-4 py-2 rounded-lg bg-blue-600 text-white text-xs font-bold">다시 시도</button>
          </div>
        `;
        return;
      }

      switch (STATE.view) {
        case 'main': renderMainMorningDashboard(vp, b); break;
        case 'dept_kpi8': renderDeptKpi8View(vp, b); break;
        case 'cost': renderCostDetailView(vp, b); break;
        case 'claim': renderClaimDetailView(vp, b); break;
        case 'process': renderProcessDetailView(vp, b); break;
        case 'lot_trace': renderLotTraceView(vp, b); break;
        case 'label_status': renderLabelStatusView(vp, b); break;
        case 'label_issue': renderRawDbView(vp, b); break;
        case 'supplier': renderSupplierView(vp, b); break;
        case 'kpi_5': renderAuditDetailView(vp, b); break;
        case 'fs_haccp_risk': renderFsHaccpRiskView(vp, b); break;
        case 'qc_defect_sub': renderQcDefectSubView(vp, b); break;
        default: renderMainMorningDashboard(vp, b);
      }
      lucide.createIcons();
    }

    // 앱 최초 실행
    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      loadBundle(false);
    });
  </script>
</body>
</html>
