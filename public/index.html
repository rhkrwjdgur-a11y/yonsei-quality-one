<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Q-Safety | 연세유업 품질안전 통합 관제 시스템</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
      background-color: #F2F4F7;
      color: #111827;
      -webkit-font-smoothing: antialiased;
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 999px; }
    ::-webkit-scrollbar-thumb:hover { background: #94A3B8; }

    .sidebar-scroll::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.22); }
    .sidebar-scroll::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.38); }

    .qo-card {
      background: #FFFFFF;
      border: 1px solid #E4E7EC;
      border-radius: 10px;
      box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04);
    }
    .qo-card-hover {
      transition: all 0.16s ease;
    }
    .qo-card-hover:hover {
      border-color: #93C5FD;
      box-shadow: 0 6px 16px rgba(0, 51, 120, 0.09);
      transform: translateY(-1px);
    }

    .badge-pill {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 11.3px;
      font-weight: 700;
      white-space: nowrap;
    }
    .badge-ok { background-color: #ECFDF5; color: #047857; border: 1px solid #A7F3D0; }
    .badge-warn { background-color: #FFFBEB; color: #B45309; border: 1px solid #FDE68A; }
    .badge-err { background-color: #FEF2F2; color: #DC2626; border: 1px solid #FECACA; }
    .badge-info { background-color: #EFF6FF; color: #003378; border: 1px solid #BFDBFE; }
    .badge-purple { background-color: #F5F3FF; color: #6D28D9; border: 1px solid #DDD6FE; }
    .badge-neutral { background-color: #F3F4F6; color: #4B5563; border: 1px solid #E5E7EB; }

    .mon-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12.4px;
      background: #FFFFFF;
      border: 1px solid #E4E7EC;
      border-radius: 8px;
      overflow: hidden;
    }
    .mon-table th {
      background: #F8FAFC;
      color: #1E293B;
      font-weight: 700;
      padding: 8.5px 10px;
      border-bottom: 1px solid #E4E7EC;
      text-align: center;
      white-space: nowrap;
    }
    .mon-table td {
      padding: 7.5px 10px;
      border-bottom: 1px solid #F1F5F9;
      color: #1F2937;
      vertical-align: middle;
      line-height: 1.45;
    }
    .mon-table tr:hover td { background-color: #F8FAFC; }
    .cell-green { background-color: #ECFDF5 !important; color: #047857 !important; font-weight: 600; }
    .cell-yellow { background-color: #FFFBEB !important; color: #B45309 !important; font-weight: 600; }
    .cell-red { background-color: #FEF2F2 !important; color: #DC2626 !important; font-weight: 600; }
    .cell-gray { background-color: #F8FAFC !important; color: #94A3B8 !important; }

    .nav-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12.8px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.80);
      transition: all 0.14s ease;
      text-align: left;
    }
    .nav-btn:hover {
      background-color: rgba(255, 255, 255, 0.10);
      color: #FFFFFF;
    }
    .nav-btn.active {
      background-color: #164E96;
      color: #FFFFFF;
      font-weight: 700;
      box-shadow: inset 3px 0 0 #93C5FD;
    }

    .subtab-btn {
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      color: #64748B;
      border-bottom: 2px solid transparent;
      transition: all 0.14s ease;
    }
    .subtab-btn:hover { color: #0F172A; }
    .subtab-btn.active {
      color: #003378;
      border-bottom-color: #003378;
      font-weight: 800;
    }

    .btn-yonsei {
      background-color: #003378;
      color: #FFFFFF;
      transition: all 0.15s ease;
    }
    .btn-yonsei:hover:not(:disabled) { background-color: #00265C; }
    .btn-yonsei:disabled { opacity: 0.6; cursor: not-allowed; }
  </style>
</head>
<body class="h-screen w-screen overflow-hidden flex select-none sm:select-auto">

  <!-- ===================================================================== -->
  <!-- 좌측 고정 사이드바 (경영정보팀 WEB MIS #003378 컬러 & img-symbol1.png)  -->
  <!-- ===================================================================== -->
  <aside class="w-[238px] shrink-0 bg-[#003378] text-white flex flex-col justify-between h-full shadow-lg z-20">
    <div class="p-3.5 overflow-y-auto sidebar-scroll">
      <div onclick="navigate('main')" class="flex items-center gap-2.5 px-2 pb-3.5 mb-2.5 border-b border-white/15 cursor-pointer group">
        <div class="w-9 h-9 rounded-full bg-white flex items-center justify-center p-0.5 shrink-0 shadow-sm overflow-hidden">
          <img
            src="/img-symbol1.png"
            alt="연세유업 심볼"
            class="w-full h-full object-contain"
            onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
          />
          <svg style="display:none;" viewBox="0 0 40 40" class="w-7 h-7 text-[#003378]" fill="none">
            <circle cx="20" cy="20" r="18" stroke="currentColor" stroke-width="2.5"/>
            <circle cx="20" cy="14" r="4" stroke="currentColor" stroke-width="2.3"/>
            <line x1="12" y1="21" x2="28" y2="21" stroke="currentColor" stroke-width="2.3"/>
            <path d="M13 29 L20 23 L27 29" stroke="currentColor" stroke-width="2.4" fill="none"/>
          </svg>
        </div>
        <div class="min-w-0">
          <div class="text-[16.5px] font-extrabold text-white tracking-wide leading-tight group-hover:text-blue-200 transition">Q-Safety</div>
          <div class="text-[10.8px] font-medium text-blue-200/80 truncate">연세유업 품질안전 통합관제</div>
        </div>
      </div>

      <!-- 1. 품질안전부문 (통합) -->
      <div class="text-[10.5px] font-bold text-blue-200/60 uppercase tracking-wider px-2.5 pt-0.5 pb-1">품질안전부문 (통합)</div>
      <div class="space-y-0.5 mb-2.5">
        <button class="nav-btn active" data-nav="main" onclick="navigate('main')">
          <span class="flex items-center gap-2.5"><i data-lucide="layout-grid" class="w-4 h-4"></i><span>통합 대시보드</span></span>
          <i data-lucide="chevron-right" class="w-3.5 h-3.5 opacity-60"></i>
        </button>
        <button class="nav-btn" data-nav="dept_kpi8" onclick="navigate('dept_kpi8')">
          <span class="flex items-center gap-2.5"><i data-lucide="bar-chart-3" class="w-4 h-4"></i><span>2026 부문 8대 KPI</span></span>
          <i data-lucide="chevron-right" class="w-3.5 h-3.5 opacity-60"></i>
        </button>
      </div>

      <!-- 2. 식품안전팀 (QA) -->
      <div class="text-[10.5px] font-bold text-blue-200/60 uppercase tracking-wider px-2.5 pt-2 pb-1 border-t border-white/10">식품안전팀 (QA)</div>
      <div class="space-y-0.5 mb-2.5">
        <button class="nav-btn" data-nav="label_status" onclick="navigate('label_status')">
          <span class="flex items-center gap-2.5"><i data-lucide="file-check-2" class="w-4 h-4"></i><span>표시사항 진행 현황</span></span>
          <i data-lucide="chevron-right" class="w-3.5 h-3.5 opacity-60"></i>
        </button>
        <button class="nav-btn" data-nav="label_issue" onclick="navigate('label_issue')">
          <span class="flex items-center gap-2.5"><i data-lucide="database" class="w-4 h-4"></i><span>원자재 표시사항 DB</span></span>
          <i data-lucide="chevron-right" class="w-3.5 h-3.5 opacity-60"></i>
        </button>
        <button class="nav-btn" data-nav="kpi_5" onclick="navigate('kpi_5')">
          <span class="flex items-center gap-2.5"><i data-lucide="gauge" class="w-4 h-4"></i><span>심사점수 · 일정 관리</span></span>
          <i data-lucide="chevron-right" class="w-3.5 h-3.5 opacity-60"></i>
        </button>
        <button class="nav-btn" data-nav="supplier" onclick="navigate('supplier')">
          <span class="flex items-center gap-2.5"><i data-lucide="building-2" class="w-4 h-4"></i><span>협력업체 관리</span></span>
          <i data-lucide="chevron-right" class="w-3.5 h-3.5 opacity-60"></i>
        </button>
        <button class="nav-btn" data-nav="fs_haccp_risk" onclick="navigate('fs_haccp_risk')">
          <span class="flex items-center gap-2.5"><i data-lucide="shield-check" class="w-4 h-4"></i><span>HACCP · 법적 RISK</span></span>
          <i data-lucide="chevron-right" class="w-3.5 h-3.5 opacity-60"></i>
        </button>
      </div>

      <!-- 3. 품질관리팀 (QC) -->
      <div class="text-[10.5px] font-bold text-blue-200/60 uppercase tracking-wider px-2.5 pt-2 pb-1 border-t border-white/10">품질관리팀 (QC)</div>
      <div class="space-y-0.5">
        <button class="nav-btn" data-nav="process" onclick="navigate('process')">
          <span class="flex items-center gap-2.5"><i data-lucide="activity" class="w-4 h-4"></i><span>공정 및 배양 실시간 관제</span></span>
          <i data-lucide="chevron-right" class="w-3.5 h-3.5 opacity-60"></i>
        </button>
        <button class="nav-btn" data-nav="lot_trace" onclick="navigate('lot_trace')">
          <span class="flex items-center gap-2.5"><i data-lucide="search-check" class="w-4 h-4"></i><span>생산이력 · LOT 역추적</span></span>
          <i data-lucide="chevron-right" class="w-3.5 h-3.5 opacity-60"></i>
        </button>
        <button class="nav-btn" data-nav="claim_nc_hist" onclick="navigate('claim_nc_hist')">
          <span class="flex items-center gap-2.5"><i data-lucide="clipboard-list" class="w-4 h-4"></i><span>클레임 · 부적합 이력</span></span>
          <i data-lucide="chevron-right" class="w-3.5 h-3.5 opacity-60"></i>
        </button>
        <button class="nav-btn" data-nav="claim" onclick="navigate('claim')">
          <span class="flex items-center gap-2.5"><i data-lucide="trending-down" class="w-4 h-4"></i><span>클레임 발생률 분석</span></span>
          <i data-lucide="chevron-right" class="w-3.5 h-3.5 opacity-60"></i>
        </button>
        <button class="nav-btn" data-nav="qc_defect_sub" onclick="navigate('qc_defect_sub')">
          <span class="flex items-center gap-2.5"><i data-lucide="package-check" class="w-4 h-4"></i><span>핵심불량 · 부자재 관리</span></span>
          <i data-lucide="chevron-right" class="w-3.5 h-3.5 opacity-60"></i>
        </button>
      </div>
    </div>

    <div class="p-3.5 border-t border-white/15 bg-[#002860]">
      <button onclick="loadBundle(true)" id="btn-sidebar-sync" class="w-full py-1.5 px-3 rounded-md bg-[#164E96] hover:bg-[#1E5BB0] border border-white/15 text-white text-xs font-semibold flex items-center justify-center gap-1.5 transition">
        <i data-lucide="refresh-cw" class="w-3.5 h-3.5" id="icon-sync"></i>
        <span id="txt-sidebar-sync">시트 실시간 갱신</span>
      </button>
      <div class="mt-2 text-[10.6px] text-blue-200/75 leading-relaxed px-0.5">
        <div>동기화 : <span id="lbl-loaded-at" class="text-white font-medium">연결 확인 중...</span></div>
        <div class="flex items-center justify-between mt-0.5">

          <span class="text-[10px] px-1.5 py-0.2 rounded bg-white/10 text-blue-100">자동갱신 ON</span>
        </div>
      </div>
    </div>
  </aside>

  <!-- ===================================================================== -->
  <!-- 우측 메인 컨텐츠 영역                                                   -->
  <!-- ===================================================================== -->
  <div class="flex-1 flex flex-col h-full min-w-0">

    <!-- 상단 글로벌 헤더 -->
    <header class="h-[50px] shrink-0 bg-white border-b border-[#E4E7EC] px-6 flex items-center justify-between gap-4">
      <div class="flex items-center gap-2 text-xs font-bold text-gray-500">
        <span class="text-[#003378] font-extrabold">Q-Safety</span>

      </div>

      <div class="flex items-center gap-2.5 shrink-0">
        <div class="relative w-64 sm:w-80">
          <i data-lucide="search" class="w-3.5 h-3.5 text-gray-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
          <input
            id="global-search-input"
            type="text"
            placeholder="LOT(소비기한 예: 05.13) · 제품명 검색..."
            class="w-full pl-9 pr-12 py-1.5 text-[12.5px] bg-[#F8FAFC] border border-gray-300 rounded-full focus:outline-none focus:bg-white focus:border-[#003378] transition"
            onkeydown="if(event.key==='Enter') triggerGlobalSearch();"
          />
          <span class="absolute right-3 top-1/2 -translate-y-1/2 text-[10px] font-semibold text-gray-400">Enter</span>
        </div>

        <button onclick="openAiBriefingModal()" class="px-3 py-1.5 rounded-full bg-[#EFF6FF] hover:bg-blue-100 text-[#003378] border border-blue-200 text-xs font-bold flex items-center gap-1.5 transition">
          <i data-lucide="sparkles" class="w-3.5 h-3.5"></i>
          <span class="hidden sm:inline">AI 요약 브리핑</span>

        <div class="hidden xl:inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-emerald-50 border border-emerald-200 text-emerald-700 text-[11.5px] font-bold">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
          <span id="top-live-pill">실시간 연동 중</span>
        </div>

        <button onclick="loadBundle(true)" title="시트 데이터 즉시 갱신" class="p-1.5 rounded-full border border-gray-200 text-gray-600 hover:text-[#003378] hover:bg-gray-50 transition">
          <i data-lucide="rotate-cw" class="w-4 h-4" id="icon-top-sync"></i>
        </button>
      </div>
    </header>

    <!-- 동적 메인 뷰포트 -->
    <main id="app-viewport" class="flex-1 min-h-0 overflow-hidden px-5 py-2.5 flex flex-col">
      <div class="h-full flex flex-col items-center justify-center text-center">
        <div class="w-10 h-10 border-4 border-[#003378] border-t-transparent rounded-full animate-spin mb-3"></div>
        <div class="text-sm font-bold text-gray-800">Q-Safety 실시간 품질안전 데이터를 불러오는 중입니다...</div>
        <div class="text-xs text-gray-500 mt-1">연세유업 품질·공정·법규·심사 구글 시트와 동기화하고 있습니다.</div>
      </div>
    </main>
  </div>

  <!-- 공통 모달창 -->
  <div id="modal-backdrop" class="fixed inset-0 bg-gray-900/45 backdrop-blur-[1px] z-50 hidden items-center justify-center p-4">
    <div class="bg-white rounded-xl border border-gray-200 shadow-2xl w-full max-w-xl overflow-hidden">
      <div class="px-5 py-3.5 bg-[#003378] text-white flex items-center justify-between">
        <h3 id="modal-title" class="text-[14.5px] font-bold">상세 정보</h3>
        <button onclick="closeModal()" class="text-white/80 hover:text-white">

        </button>
      </div>
      <div id="modal-body" class="p-5 text-sm text-gray-700 max-h-[78vh] overflow-y-auto"></div>
    </div>
  </div>

      kpi_11: 'supplier',
      kpi_8: 'fs_haccp_risk',
      kpi_12: 'fs_haccp_risk',
      kpi_9: 'qc_defect_sub',
      kpi_10: 'qc_defect_sub'
    };

    function esc(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function fmtNum(n, digits = 0) {
      const v = Number(n || 0);
      return v.toLocaleString('ko-KR', { minimumFractionDigits: digits, maximumFractionDigits: digits });
    }

    function signalDotHtml(sig) {
      const map = {
        green: 'bg-emerald-500 ring-4 ring-emerald-500/15',
        yellow: 'bg-amber-500 ring-4 ring-amber-500/15',
        red: 'bg-red-500 ring-4 ring-red-500/15',
        gray: 'bg-gray-400 ring-4 ring-gray-400/15'
      };
      return `<span class="inline-block w-2.5 h-2.5 rounded-full ${map[sig] || map.green}"></span>`;
    }

    let toastTimer = null;
    function showToast(msg, isErr = false) {
      const el = document.getElementById('toast-box');
      el.textContent = msg;
      el.className = `fixed bottom-5 right-5 z-50 px-4 py-2.5 rounded-lg text-white text-xs font-bold shadow-xl transition ${isErr ? 'bg-red-600' : 'bg-[#003378]'}`;
      el.classList.remove('hidden');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.add('hidden'), 2600);
    }

    function setButtonBusy(btnEl, busyText = '저장 중...') {
      if (!btnEl) return () => {};
      const origHtml = btnEl.innerHTML;
      btnEl.disabled = true;
      btnEl.innerHTML = `<span class="inline-block w-3 h-3 border-2 border-white border-t-transparent rounded-full animate-spin mr-1.5 align-middle"></span>${busyText}`;
      return () => {
        btnEl.disabled = false;
        btnEl.innerHTML = origHtml;
      };
    }

    function destroyCharts() {
      Object.values(STATE.charts).forEach(ch => {
        try { ch.destroy(); } catch (e) {}
      });
      STATE.charts = {};
    }

    function openModal(title, bodyHtml) {
      document.getElementById('modal-title').textContent = title;
      document.getElementById('modal-body').innerHTML = bodyHtml;
      const bd = document.getElementById('modal-backdrop');
      bd.classList.remove('hidden');
      bd.classList.add('flex');
      lucide.createIcons();
    }

    function closeModal() {
      const bd = document.getElementById('modal-backdrop');
      bd.classList.add('hidden');
      bd.classList.remove('flex');
    }

    function saveLocalBundleBackup(bundle) {
      try {
        if (bundle && bundle.ok) {
          localStorage.setItem(LOCAL_BACKUP_KEY, JSON.stringify(bundle));
        }
      } catch (e) {}
    }

    function loadLocalBundleBackup() {
      try {
        const raw = localStorage.getItem(LOCAL_BACKUP_KEY);
        if (!raw) return null;
        const parsed = JSON.parse(raw);
        return (parsed && parsed.ok) ? parsed : null;
      } catch (e) {
        return null;
      }
    }

    // =========================================================================
    // 네비게이션 라우터
    // =========================================================================
    function navigate(viewName, extra = {}) {
      if (viewName === 'kpi_8' || viewName === 'kpi_12') {
        STATE.fsTab = viewName;
        viewName = 'fs_haccp_risk';
      } else if (viewName === 'kpi_9' || viewName === 'kpi_10') {
        STATE.qcTab = viewName;
        viewName = 'qc_defect_sub';
      } else if (viewName === 'kpi_11') {
        STATE.supTab = 'kpi';
        viewName = 'supplier';
      }

      if (extra.procTab) STATE.procTab = extra.procTab;
      if (extra.dairySubTab) STATE.dairySubTab = extra.dairySubTab;
      if (extra.labelTab) STATE.labelTab = extra.labelTab;
      if (extra.fsTab) STATE.fsTab = extra.fsTab;
      if (extra.auditTab) STATE.auditTab = extra.auditTab;
      if (extra.supTab) STATE.supTab = extra.supTab;

      STATE.view = viewName;

      const navTarget = ACTIVE_NAV_ALIAS[viewName] || viewName;
      document.querySelectorAll('.nav-btn').forEach(btn => {
        if (btn.dataset.nav === navTarget) btn.classList.add('active');
        else btn.classList.remove('active');
      });

      const bc = document.getElementById('header-breadcrumb');
      if (bc) bc.textContent = VIEW_TITLES[viewName] || '통합 대시보드';

      const vp = document.getElementById('app-viewport');
      if (viewName === 'main' || viewName === 'dept_kpi8') {
        vp.classList.remove('overflow-y-auto');
        vp.classList.add('overflow-hidden');
      } else {
        vp.classList.remove('overflow-hidden');
        vp.classList.add('overflow-y-auto');
        vp.scrollTop = 0;
      }

      renderCurrentView();
    }

    function jumpToLotTrace(prodKw = '', expStr = '') {
      STATE.lotQuery.product = 'ALL';
      STATE.lotQuery.kw = (prodKw && prodKw !== '-') ? prodKw : '';
      STATE.lotQuery.exp = (expStr && expStr !== '-') ? expStr : '';
      navigate('lot_trace');
      if (STATE.lotQuery.kw || STATE.lotQuery.exp) {
        executeLotTraceSearch();
      }
    }

    function triggerGlobalSearch() {
      const inp = document.getElementById('global-search-input');
      const q = (inp.value || '').trim();
      if (!q) return;
      inp.value = '';
      if (/\d{1,4}[\.\-\/]\d{1,2}/.test(q)) {
        jumpToLotTrace('', q);
      } else {
        jumpToLotTrace(q, '');
      }
    }

    // =========================================================================
    // 무중단 시트 동기화 엔진
    // =========================================================================
    function applyBundleDefaults(data) {
      if (!data || !data.ok) return;
      if (data.loaded_at) {
        document.getElementById('lbl-loaded-at').textContent = data.loaded_at;
        document.getElementById('top-live-pill').textContent = `실시간 연동 · ${data.loaded_time_short || ''}`;
      }
      if (data.process) {
        if (!STATE.soySelTab && data.process.soy_default_tab) {
          STATE.soySelTab = data.process.soy_default_tab;
        }
        if (!STATE.dairyHistDate && data.process.dairy_hist_p && data.process.dairy_hist_p.length > 0) {
          const dts = [...new Set(data.process.dairy_hist_p.map(r => r['생산일자']).filter(Boolean))].sort().reverse();
          if (dts.length) STATE.dairyHistDate = dts[0];
        }
        if (!STATE.soyHistDate && data.process.soy_hist && data.process.soy_hist.length > 0) {
          const col = data.process.soy_hist[0]['확정검사일_탭기준'] !== undefined ? '확정검사일_탭기준' : '검사일_표기';
          const dts = [...new Set(data.process.soy_hist.map(r => r[col]).filter(Boolean))].sort().reverse();
          if (dts.length) STATE.soyHistDate = dts[0];
        }
      }
      if (data.claim && data.claim.years && data.claim.years.length > 0) {
        if (!data.claim.years.includes(STATE.claimDivYear)) {
          STATE.claimDivYear = data.claim.years[0];
        }
      }
    }

    async function loadBundle(force = false, silent = false) {
      if (STATE.isSyncing) return;
      STATE.isSyncing = true;

      const syncIcon = document.getElementById('icon-sync');
      const topIcon = document.getElementById('icon-top-sync');
      const syncTxt = document.getElementById('txt-sidebar-sync');
      if (syncIcon) syncIcon.classList.add('animate-spin');
      if (topIcon) topIcon.classList.add('animate-spin');
      if (syncTxt && force) syncTxt.textContent = '시트 동기화 중...';

      try {
        const res = await fetch(`/api/bundle?force=${force ? 1 : 0}`);
        const data = await res.json();

        if (data && data.ok) {
          STATE.bundle = data;
          saveLocalBundleBackup(data);
          applyBundleDefaults(data);
          renderCurrentView();
          if (force && !silent) showToast('전체 구글 시트 최신 데이터 갱신 완료');

          if (data.errors && data.errors.length > 0 && !silent) {
            setTimeout(() => loadBundle(true, true), 6500);
          }
        } else if (!STATE.bundle) {
          STATE.bundle = data;
          renderCurrentView();
        }
      } catch (err) {
        if (!silent) showToast('일시적 통신 지연 — 직전 정상 데이터를 유지합니다.', true);
        console.error(err);
      } finally {
        STATE.isSyncing = false;
        if (syncIcon) syncIcon.classList.remove('animate-spin');
        if (topIcon) topIcon.classList.remove('animate-spin');
        if (syncTxt) syncTxt.textContent = '시트 실시간 갱신';
      }
    }

    // =========================================================================
    // [화면 1] 통합 대시보드 — 모닝 브리핑 (가시성·비율 최적화 완전체, KPI 배제)

      // -----------------------------------------------------------------------
      // [카드 1] 좌상: 4대 공정·출고 타일 대형화 + 하단 특이사항 슬림 바
      // -----------------------------------------------------------------------

      const dyDot = ps.active_dairy_cnt > 0 ? 'bg-emerald-500 ring-4 ring-emerald-500/15' : 'bg-gray-400';

      let soyBadge = '<span class="badge-pill badge-ok !text-[12px] !px-2.5 !py-1">배양 적합</span>';

      if (ps.soy_contam_total > 0) {

      }

      const mcStatus = mc.status || '출고적합';
      let mcBadge = '<span class="badge-pill badge-ok !text-[12px] !px-2.5 !py-1">출고적합</span>';
      let mcDot = 'bg-emerald-500 ring-4 ring-emerald-500/15';
      if (mcStatus === '검사중') {
        mcBadge = '<span class="badge-pill badge-warn !text-[12px] !px-2.5 !py-1">배양·검사중</span>';
        mcDot = 'bg-amber-500 ring-4 ring-amber-500/15';
      } else if (mcStatus.includes('보류') || mcStatus.includes('부적합')) {

      }

      const noteItems = [];
      (ps.yest_notes || []).forEach(n => {
        noteItems.push(`<div class="py-0.5 text-[11.6px] leading-snug"><span class="inline-block px-1.5 py-0.2 rounded bg-slate-200 text-slate-800 font-bold text-[10.3px] mr-1.5">전일(${esc(ps.rt_yest_tab)})</span>${esc(n)}</div>`);

      (ps.today_notes || []).forEach(n => {
        noteItems.push(`<div class="py-0.5 text-[11.6px] leading-snug"><span class="inline-block px-1.5 py-0.2 rounded bg-amber-100 text-amber-900 font-bold text-[10.3px] mr-1.5">금일(${esc(ps.rt_today_tab)})</span>${esc(n)}</div>`);

      // -----------------------------------------------------------------------
      // [카드 2] 우상: 좌(부서별 심의 건수 브리핑 + 대표 표시사항) + 우(법규 [고시]/[예고] + 조치요약) + 하단 슬림 메모
      // -----------------------------------------------------------------------
      const deptChips = (lb.rev_dept_breakdown || []).slice(0, 4).map(d =>

      const featList = lb.featured_reviewing || [];
      const revHtml = featList.length > 0

      // -----------------------------------------------------------------------
      // [카드 4] 우하: 클레임 · 부적합 5단계 직관적 텍스트 게이지
      // -----------------------------------------------------------------------
      const activeCnh = cnh.active_items || [];
      const cnhHtml = activeCnh.length > 0

    async function executeLotTraceSearch() {
      const prodEl = document.getElementById('lot-sel-prod');
      const expEl = document.getElementById('lot-in-exp');
      const kwEl = document.getElementById('lot-in-kw');

      if (prodEl) STATE.lotQuery.product = prodEl.value;
      if (expEl) STATE.lotQuery.exp = expEl.value.trim();
      if (kwEl) STATE.lotQuery.kw = kwEl.value.trim();

      if (STATE.lotQuery.product === 'ALL' && !STATE.lotQuery.exp && !STATE.lotQuery.kw) {
        showToast('제품명을 선택하거나 소비기한/키워드를 입력해 주세요.', true);
        return;
      }

      STATE.lotQuery.loading = true;
      renderCurrentView();

      try {
        const params = new URLSearchParams({
          product: STATE.lotQuery.product === 'ALL' ? '' : STATE.lotQuery.product,
          exp: STATE.lotQuery.exp,
          kw: STATE.lotQuery.kw
        });
        const res = await fetch(`/api/lot-trace?${params.toString()}`);
        STATE.lotQuery.result = await res.json();
      } catch (e) {
        showToast('로트 역추적 조회 중 오류가 발생했습니다.', true);
      } finally {
        STATE.lotQuery.loading = false;
        renderCurrentView();
      }
    }

    // 0.05초 낙관적 화면 선반영(Optimistic UI) & 초고속 단독 시트 직통 저장 액션
    // =========================================================================
    function computeOptimisticAuditSummary(schedList, todayStr) {
      if (!schedList || !schedList.length) {
        return {
          has_data: false, upcoming_banner: '등록된 방문심사 · 협력업체 방문 일정이 없습니다',
          has_visit_gauge: false, visit_title: '등록된 방문심사 일정이 없습니다', status: '심사준비중', pct: 0, color: '#9CA3AF', active_uid: ''
        };
      }
      const stMap = {};
      AUDIT_STAGES.forEach(s => { stMap[s.name] = s; });

      const futureAll = schedList.filter(r => (r['심사일자'] || '') >= todayStr && r['진행현황'] !== '심사종료').sort((a, z) => a['심사일자'].localeCompare(z['심사일자']));
      const nearest = futureAll[0] || schedList[schedList.length - 1];
      const diffN = Math.round((new Date(nearest['심사일자']) - new Date(todayStr)) / 86400000);
      const dTag = diffN === 0 ? '금일(D-Day)' : (diffN > 0 ? `D-${diffN}` : '최근');
      const upBanner = `[${nearest['구분'] || '방문심사'} · ${dTag}] ${nearest['심사명']} (${(nearest['심사일자'] || '').slice(5)})`;

      const visitList = schedList.filter(r => (r['구분'] || '방문심사') === '방문심사');
      if (!visitList.length) {
        return {
          has_data: true, upcoming_banner: upBanner, has_visit_gauge: false,
          visit_title: "현재 등록된 '방문심사' 일정이 없습니다", status: '심사준비중', pct: 0, color: '#9CA3AF', active_uid: ''
        };
      }
      const vToday = visitList.find(r => r['심사일자'] === todayStr);
      const vProg = visitList.find(r => ['심사중', '서류심사중', '현장심사중'].includes(r['진행현황']));
      const vFut = visitList.filter(r => r['심사일자'] > todayStr).sort((a, z) => a['심사일자'].localeCompare(z['심사일자']));
      const target = vToday || vProg || vFut[0] || visitList[visitList.length - 1];
      const stObj = stMap[target['진행현황']] || AUDIT_STAGES[0];
      return {
        has_data: true, upcoming_banner: upBanner, has_visit_gauge: true,
        visit_title: `[방문심사 · ${(target['심사일자'] || '').slice(5)}] ${target['심사명']}`,
        status: stObj.name, pct: stObj.pct, color: stObj.color, active_uid: target['고유ID']
      };
    }

    async function submitAuditSchedule(action, uid = '', btnEl = null) {
      const payload = { action, uid };
      const nowStr = new Date().toISOString().slice(0, 19).replace('T', ' ');
      const curList = [...(STATE.bundle.audit.schedules || [])];

      if (action === 'add') {
        payload.uid = Math.random().toString(36).slice(2, 10);
        payload.audit_type = document.getElementById('aud-add-tp').value;
        payload.audit_date = document.getElementById('aud-add-dt').value;
        payload.status = document.getElementById('aud-add-st').value;
        payload.audit_name = document.getElementById('aud-add-nm').value.trim();
        payload.score = document.getElementById('aud-add-sc').value.trim();
        payload.memo = document.getElementById('aud-add-mm').value.trim();
        if (!payload.audit_name) { showToast('심사명 또는 방문 업체명을 입력해 주세요.', true); return; }

        curList.push({
          '고유ID': payload.uid, '구분': payload.audit_type, '심사일자': payload.audit_date,
          '심사명': payload.audit_name, '진행현황': payload.status, '점수': payload.score, '비고': payload.memo, '수정일시': nowStr
        });
      } else if (action === 'update') {
        payload.audit_type = document.getElementById('aud-up-tp').value;
        payload.audit_date = document.getElementById('aud-up-dt').value;
        payload.status = document.getElementById('aud-up-st').value;
        payload.audit_name = document.getElementById('aud-up-nm').value.trim();
        payload.score = document.getElementById('aud-up-sc').value.trim();
        payload.memo = document.getElementById('aud-up-mm').value.trim();

        curList.forEach(it => {
          if (it['고유ID'] === uid) {
            it['구분'] = payload.audit_type;
            it['심사일자'] = payload.audit_date;
            it['진행현황'] = payload.status;
            it['심사명'] = payload.audit_name;
            it['점수'] = payload.score;
            it['비고'] = payload.memo;
            it['수정일시'] = nowStr;
          }
        });
      } else if (action === 'delete') {
        const idx = curList.findIndex(it => it['고유ID'] === uid);
        if (idx >= 0) curList.splice(idx, 1);
      }

      const restoreBtn = setButtonBusy(btnEl, '저장 중...');
      curList.sort((a, z) => (a['심사일자'] || '').localeCompare(z['심사일자'] || ''));
      STATE.bundle.audit.schedules = curList;
      STATE.bundle.audit.summary = computeOptimisticAuditSummary(curList, STATE.bundle.loaded_date || '');
      renderCurrentView();

      try {
        const res = await fetch('/api/audit-schedule', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const rj = await res.json();
        if (rj.ok) {
          STATE.bundle.audit.summary = rj.summary;
          STATE.bundle.audit.schedules = rj.schedules;
          saveLocalBundleBackup(STATE.bundle);
          renderCurrentView();
          showToast(rj.message || '심사 일정이 저장되었습니다.');
        }
      } catch (e) {
        showToast('시트 저장 중 오류가 발생했습니다.', true);
      } finally {
        restoreBtn();
      }
    }

    async function updateLawPrefCore(lawId, modeVal, prepVal, sumVal) {
      const lw = STATE.bundle.law;
      (lw.all_laws || []).forEach(it => {
        if (it.law_id === lawId) {
          if (modeVal) it.show_on_dashboard = (modeVal === 'Pin');
          if (prepVal) it.prep_status = prepVal;
          if (sumVal !== null && sumVal !== undefined) {
            it['실무조치요약'] = sumVal || it['자동조치요약'];
          }
        }
      });
      lw.dashboard_laws = (lw.all_laws || []).filter(x => x.show_on_dashboard).sort((a, z) => (a._sort_k || 0) - (z._sort_k || 0));
      lw.active_cnt = lw.dashboard_laws.length;
      lw.urgent_cnt = lw.dashboard_laws.filter(x => x.d_day !== null && x.d_day >= 0 && x.d_day <= 60 && x.prep_status !== '반영완료').length;
      renderCurrentView();
      showToast('법규 D-Day 설정이 반영되었습니다.');

      try {
        const payload = { law_id: lawId };
        if (modeVal) payload.mode = modeVal;
        if (prepVal) payload.prep = prepVal;
        if (sumVal !== null && sumVal !== undefined) payload.summary = sumVal;

        const res = await fetch('/api/law-pref', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const rj = await res.json();
        if (rj.ok && rj.law) {
          STATE.bundle.law = rj.law;
          saveLocalBundleBackup(STATE.bundle);
          renderCurrentView();
        }
      } catch (e) {
        showToast('법규 설정 저장 실패', true);
      }
    }

    function rebuildLocalCnhStats(cnhObj) {
      const all = cnhObj.all_items || [];
      cnhObj.active_items = all.filter(x => x['대시보드노출'] === 'Y').sort((a, z) => (a['중요도'] === '중점관리' ? 0 : 1) - (z['중요도'] === '중점관리' ? 0 : 1));
      cnhObj.counts = {
        total: all.length,
        claim: all.filter(x => x['구분'] === '클레임').length,
        nc: all.filter(x => x['구분'] === '부적합').length,
        active: cnhObj.active_items.length,
        major: all.filter(x => x['중요도'] === '중점관리').length
      };
    }

        if (rj.ok && rj.claim_nc_hist) {
          STATE.bundle.claim_nc_hist = rj.claim_nc_hist;
          saveLocalBundleBackup(STATE.bundle);
          renderCurrentView();
        }
      } catch (e) {
        showToast('상태 저장 실패', true);
      }
    }

    async function toggleClaimNcDash(uid, category) {
      const cnh = STATE.bundle.claim_nc_hist;
      (cnh.all_items || []).forEach(it => {
        if (it['고유ID'] === uid) it['대시보드노출'] = it['대시보드노출'] === 'Y' ? 'N' : 'Y';
      });
      rebuildLocalCnhStats(cnh);
      renderCurrentView();
      showToast('대시보드 노출 상태가 변경되었습니다.');

      const res = await fetch('/api/claim-nc-history', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'toggle_dash', uid, category })
      });
      const rj = await res.json();
      if (rj.ok && rj.claim_nc_hist) {
        STATE.bundle.claim_nc_hist = rj.claim_nc_hist;
        saveLocalBundleBackup(STATE.bundle);
        renderCurrentView();
      }
    }

    async function deleteClaimNcItem(uid, category) {
      const cnh = STATE.bundle.claim_nc_hist;
      cnh.all_items = (cnh.all_items || []).filter(it => it['고유ID'] !== uid);
      rebuildLocalCnhStats(cnh);
      renderCurrentView();

      const res = await fetch('/api/claim-nc-history', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'delete', uid, category })
      });
      const rj = await res.json();
      if (rj.ok && rj.claim_nc_hist) {
        STATE.bundle.claim_nc_hist = rj.claim_nc_hist;
        saveLocalBundleBackup(STATE.bundle);
        renderCurrentView();
        showToast('이력이 삭제되었습니다.');
      }
    }

    async function saveManualKpi(kpiKey, btnEl = null) {
      const notesRaw = document.getElementById(`mk-notes-${kpiKey}`).value || '';
      const payload = {
        kpi_key: kpiKey,
        target_text: document.getElementById(`mk-t-txt-${kpiKey}`).value,
        actual_text: document.getElementById(`mk-a-txt-${kpiKey}`).value,
        sub_badge: document.getElementById(`mk-sub-${kpiKey}`).value,
        signal: document.getElementById(`mk-sig-${kpiKey}`).value,
        target_num: Number(document.getElementById(`mk-t-num-${kpiKey}`).value || 0),
        actual_num: Number(document.getElementById(`mk-a-num-${kpiKey}`).value || 0),
        notes_title: document.getElementById(`mk-nt-${kpiKey}`).value,
        notes: notesRaw.split('\n').map(s => s.trim()).filter(Boolean)
      };

      const restoreBtn = setButtonBusy(btnEl, '저장 중...');
      STATE.bundle.manual_kpis[kpiKey] = {
        ...STATE.bundle.manual_kpis[kpiKey],
        ...payload,
        compact_val: payload.actual_text.split(',')[0].trim()
      };
      renderCurrentView();

      try {
        const res = await fetch('/api/manual-kpi', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const rj = await res.json();
        if (rj.ok) {
          STATE.bundle.manual_kpis = rj.manual_kpis;
          saveLocalBundleBackup(STATE.bundle);
          renderCurrentView();
          showToast('구글 시트에 KPI 설정이 즉시 저장되었습니다.');
        }
      } catch (e) {
        showToast('KPI 저장 실패', true);
      } finally {
        restoreBtn();
      }
    }

    // 미생물 출고 판정 & 표시사항 메모 모달
    function openMicroStatusModal() {
      const mc = (STATE.bundle && STATE.bundle.special_boards && STATE.bundle.special_boards.micro_status) || { status: '출고적합', note: '' };
      openModal('금일 미생물 검사 결과 및 출고 적합성 판정', `
        <p class="text-xs text-gray-500 mb-3">당일 완제품(우유 · 발효유 · 두유) 미생물 검사 진행 상태 및 출고 가능 여부를 기록하면 모닝 브리핑 우측 판정 카드에 즉시 반영됩니다.</p>
        <div class="mb-3">
          <label class="block text-xs font-bold text-gray-700 mb-1.5">출고 판정 상태 선택</label>
          <div class="grid grid-cols-3 gap-2">
            ${['출고적합', '검사중', '재검·출고보류'].map(st => `
              <label class="cursor-pointer">
                <input type="radio" name="micro-st-radio" value="${st}" ${mc.status === st ? 'checked' : ''} class="peer hidden" />
                <div class="py-2 px-2 text-center rounded-lg border text-xs font-bold peer-checked:bg-[#003378] peer-checked:text-white peer-checked:border-[#003378] bg-gray-50 text-gray-700 border-gray-200 transition">
                  ${st}
                </div>
              </label>
            `).join('')}
          </div>
        </div>
        <div class="mb-4">
          <label class="block text-xs font-bold text-gray-700 mb-1">세부 검사 메모 (품목 / 균수 / 특이사항)</label>
          <input id="modal-micro-note" type="text" value="${esc(mc.note || '')}" placeholder="예: 전 품목 일반세균·대장균군 음성 (정상 출고)"
            class="w-full px-3 py-2 text-xs border border-gray-300 rounded-lg focus:outline-none focus:border-[#003378]" />
        </div>
        ${mc.updated_at ? `<div class="text-[11px] text-gray-400 mb-3">최근 저장 일시 : ${esc(mc.updated_at)}</div>` : ''}
        <div class="flex justify-end gap-2">
          <button onclick="closeModal()" class="px-3.5 py-1.5 rounded-lg border border-gray-200 text-xs font-semibold text-gray-600">취소</button>
          <button onclick="saveMicroStatusFromModal(this)" class="px-4 py-1.5 rounded-lg btn-yonsei text-xs font-bold">판정 즉시 저장</button>
        </div>
      `);
    }

    async function saveMicroStatusFromModal(btnEl) {
      const checked = document.querySelector('input[name="micro-st-radio"]:checked');
      const statusVal = checked ? checked.value : '출고적합';
      const noteVal = document.getElementById('modal-micro-note').value.trim() || '완제품 미생물 규격 적합 (출고 이상 없음)';
      const restoreBtn = setButtonBusy(btnEl, '저장 중...');

      STATE.bundle.special_boards.micro_status = { status: statusVal, note: noteVal, updated_at: '방금 전' };
      closeModal();
      renderCurrentView();

      try {
        const res = await fetch('/api/special-boards', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ micro_status: { status: statusVal, note: noteVal } })
        });
        const rj = await res.json();
        if (rj.ok) {
          STATE.bundle.special_boards = rj.special_boards;
          saveLocalBundleBackup(STATE.bundle);
          renderCurrentView();
          showToast(`미생물 출고 판정이 '${statusVal}'(으)로 저장되었습니다.`);
        }
      } catch (e) {
        showToast('저장 중 통신 오류가 발생했습니다.', true);
      } finally {
        restoreBtn();
      }
    }

    function openLabelMemoModal() {
      const curMemo = String((STATE.bundle && STATE.bundle.special_boards && STATE.bundle.special_boards.label_memo) || '').trim();
      openModal('표시사항 특이사항 메모 편집 (즉시 저장)', `
        <p class="text-xs text-gray-500 mb-2">원재료 변경, 신규 알레르기 혼입 점검, 부자재 발주 전 체크 사항을 기록하면 대시보드 하단에 즉시 공유됩니다.</p>
        <textarea id="modal-lbl-memo" rows="5" class="w-full p-3 text-xs border border-gray-300 rounded-lg focus:outline-none focus:border-[#003378]">${esc(curMemo)}</textarea>
        <div class="flex justify-end gap-2 mt-4">
          <button onclick="closeModal()" class="px-3.5 py-1.5 rounded-lg border border-gray-200 text-xs font-semibold text-gray-600">취소</button>
          <button onclick="saveLabelMemoFromModal(this)" class="px-4 py-1.5 rounded-lg btn-yonsei text-xs font-bold">즉시 저장</button>
        </div>
      `);
    }

    async function saveLabelMemoFromModal(btnEl) {
      const val = document.getElementById('modal-lbl-memo').value.trim();
      const restoreBtn = setButtonBusy(btnEl, '저장 중...');

      STATE.bundle.special_boards.label_memo = val;
      closeModal();
      renderCurrentView();

      try {
        const res = await fetch('/api/special-boards', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ label_memo: val })
        });
        const rj = await res.json();
        if (rj.ok) {
          STATE.bundle.special_boards = rj.special_boards;
          saveLocalBundleBackup(STATE.bundle);
          renderCurrentView();
          showToast('표시사항 특이사항 메모가 저장되었습니다.');
        }
      } catch (e) {
        showToast('메모 저장 실패', true);
      } finally {
        restoreBtn();
      }
    }

    async function openAiBriefingModal() {
      openModal('Q-Safety AI 모닝 팩트 브리핑', '<div class="py-6 text-center text-xs font-semibold text-[#003378]">실시간 구글 시트 지표를 요약하고 있습니다...</div>');
      try {
        const res = await fetch('/api/ai-briefing', { method: 'POST' });
        const rj = await res.json();
        document.getElementById('modal-body').innerHTML = `
          <div class="p-4 rounded-lg bg-blue-50/70 border border-blue-200 text-[13px] text-gray-800 leading-relaxed whitespace-pre-line">${esc(rj.briefing || '')}</div>
          <div class="mt-3 flex items-center justify-between text-[11px] text-gray-400">
            <span>분석 엔진 : ${rj.source === 'gemini_api' ? 'Gemini 2.5 Flash (실시간 팩트 기반)' : 'Q-Safety 내장 팩트 엔진'}</span>
            <button onclick="closeModal()" class="px-3.5 py-1.5 rounded-lg btn-yonsei text-xs font-bold">확인</button>
          </div>
        `;
      } catch (e) {
        document.getElementById('modal-body').innerHTML = '<div class="text-xs text-red-600">브리핑 생성에 실패했습니다.</div>';
      }
    }

    function openErrorsModal() {
      const errs = (STATE.bundle && STATE.bundle.errors) || [];
      openModal('시트 연동 상태 점검 내역', `
        <p class="text-xs text-gray-500 mb-2">일시 통신 지연이 발생한 시트는 자동으로 직전 정상 데이터를 유지하며 백그라운드에서 재연결합니다.</p>
        <ul class="space-y-1.5 text-xs text-red-700 list-disc pl-4">
          ${errs.map(e => `<li>${esc(e)}</li>`).join('')}
        </ul>
      `);
    }

    // =========================================================================
    // 통합 뷰 디스패처 & 초기 구동
    // =========================================================================
    function renderCurrentView() {
      destroyCharts();
      const vp = document.getElementById('app-viewport');
      const b = STATE.bundle;

      if (!b) return;
      if (!b.ok) {
        vp.innerHTML = `
          <div class="qo-card p-6 max-w-xl mx-auto my-auto text-center">
            <div class="text-base font-extrabold text-red-600 mb-2">구글 시트 인증 환경변수를 확인해 주세요</div>
            <div class="text-xs text-gray-600 leading-relaxed mb-4">${(b.errors || []).map(esc).join('<br>')}</div>
            <button onclick="loadBundle(true)" class="px-4 py-2 rounded-lg btn-yonsei text-xs font-bold">다시 시도</button>
          </div>
        `;
        return;
      }

      switch (STATE.view) {
        case 'main': renderMainMorningDashboard(vp, b); break;
        case 'dept_kpi8': renderDeptKpi8View(vp, b); break;
        case 'cost': renderCostDetailView(vp, b); break;
        case 'claim': renderClaimDetailView(vp, b); break;
        case 'claim_nc_hist': renderClaimNcHistoryView(vp, b); break;
        case 'process': renderProcessDetailView(vp, b); break;
        case 'lot_trace': renderLotTraceView(vp, b); break;
        case 'label_status': renderLabelStatusView(vp, b); break;
        case 'label_issue': renderRawDbView(vp, b); break;
        case 'supplier': renderSupplierView(vp, b); break;
        case 'kpi_5': renderAuditDetailView(vp, b); break;
        case 'fs_haccp_risk': renderFsHaccpRiskView(vp, b); break;
        case 'qc_defect_sub': renderQcDefectSubView(vp, b); break;
        default: renderMainMorningDashboard(vp, b);
      }
      lucide.createIcons();
    }

    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();

      const cached = loadLocalBundleBackup();
      if (cached) {
        STATE.bundle = cached;
        applyBundleDefaults(cached);
        renderCurrentView();
      }

      loadBundle(false, true);

      setInterval(() => {
        if (!document.hidden) {
          loadBundle(false, true);
        }
      }, 180000);
    });
  </script>
</body>
</html>
